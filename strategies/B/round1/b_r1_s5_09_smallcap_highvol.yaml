name: b_r1_s5_09_smallcap_highvol
type: rule
desc: "60日波动高于3%时承担的风险需要补偿，市值最小的一批同时承受流动性折价与波动溢价，补偿最厚；波动回落到2%以下（补偿消失）或持有20日、止损10%离场。"
buy:
- {op: vol_n, n: 60, dir: above, threshold: 3.0}
sell:
- {op: vol_n, n: 60, dir: below, threshold: 2.0}
rank: {op: size_ln, order: asc}
max_hold_days: 20
stop_loss: 10
max_positions: 10
industry_cap: 5
