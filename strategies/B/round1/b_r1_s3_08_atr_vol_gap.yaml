name: b_r1_s3_08_atr_vol_gap
type: rule
desc: 20日真实振幅高于3%但日收益波动低于2%，说明盘中反复洗盘却始终没让收盘价趋势化，是主力在震荡中吸筹的典型形态、后续拉升前的筹码成本被反复夯低；在"日内剧烈、日间平静"的集合里按流通市值升序取10只（吸筹对中小盘更显著）、持有20日，单日换手破5%（放量出货）离场，止损8%。
buy:
- op: atr_close_n
  n: 20
  dir: above
  threshold: 3.0
- op: vol_n
  n: 20
  dir: below
  threshold: 2.0
rank:
  op: size_ln
  order: asc
sell:
- op: turn
  dir: above
  threshold: 5.0
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 0
