name: b_r1_s5_17_low_ps_stable
type: rule
desc: "PS全为正、不像PE会被亏损污染，低PS且20日波动低于1%的公司是被市场遗忘的稳定营收资产，估值修复路径最干净；60日波动放大到5%以上（稳定性结束）或持有20日、止损8%离场。"
buy:
- {op: vol_n, n: 20, dir: below, threshold: 1.0}
sell:
- {op: vol_n, n: 60, dir: above, threshold: 5.0}
rank: {op: ps_ttm, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 0
