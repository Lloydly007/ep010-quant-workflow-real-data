name: b_r1_s5_13_smallcap_premium
type: rule
desc: "小市值承担流动性折价，长期需要更高收益补偿，但只有在20日均换手高于2%（持续有承接、能进能出）时才买流通市值最小的几只；20日均换手掉到1%以下（流动性枯竭）或持有40日、止损10%离场。"
buy:
- {op: turn_ma_n, n: 20, dir: above, threshold: 2.0}
sell:
- {op: turn_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: size_ln, order: asc}
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 3
