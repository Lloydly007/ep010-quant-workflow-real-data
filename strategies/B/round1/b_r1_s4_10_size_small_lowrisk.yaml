name: b_r1_s4_10_size_small_lowrisk
type: rule
desc: 小市值溢价常被高换手垃圾股的投机噪声污染，只有同时低波、低换手的才是真正被低估的小盘经营资产→买入低波低换手小盘股、按市值升序取最小的10只，持有60日，60日溃疡指数破15%即防御离场。
buy:
- op: vol_n
  n: 60
  dir: below
  threshold: 3.0
- op: turn
  dir: below
  threshold: 3.0
sell:
- op: ulcer_n
  n: 60
  dir: above
  threshold: 15.0
rank:
  op: size_ln
  order: asc
max_hold_days: 60
stop_loss: 10
max_positions: 10
industry_cap: 5
