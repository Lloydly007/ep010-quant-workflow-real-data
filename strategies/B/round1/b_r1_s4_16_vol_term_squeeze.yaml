name: b_r1_s4_16_vol_term_squeeze
type: rule
desc: 250日波动率仍在3%以上说明这只票长期承担着高波动风险补偿，而20日波动已压缩到2%以下说明分歧突然消失、卖压枯竭，收缩越剧烈后续估值修复越干净→买入“长期高波、近期极静”里收缩最猛的10只，持有20日，20日波动重新破5%（收缩结束）即退出，同行业最多3只。
buy:
- op: vol_n
  n: 20
  dir: below
  threshold: 2.0
- op: vol_n
  n: 250
  dir: above
  threshold: 3.0
sell:
- op: vol_n
  n: 20
  dir: above
  threshold: 5.0
rank:
  op: xsec_pct
  of:
    op: vol_n
    n: 250
  order: desc
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 3
