name: b_r1_s4_14_crowd_exit
type: rule
desc: 换手回到1%以上说明流动性已恢复、可以低成本进出，而单日换手冲上8%是散户跟风盘拥挤见顶的可观测标志，在拥挤形成时离场比固定持有期更能保住利润→买入有一定成交但相对最冷门的票（按换手截面分位升序），换手破8%即卖出，叠加20日上限与5%止损。
buy:
- op: turn
  dir: above
  threshold: 1.0
sell:
- op: turn
  dir: above
  threshold: 8.0
rank:
  op: xsec_pct
  of:
    op: turn
  order: asc
max_hold_days: 20
stop_loss: 5
max_positions: 10
industry_cap: 5
