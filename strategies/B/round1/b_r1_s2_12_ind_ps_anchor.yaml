name: b_r1_s2_12_ind_ps_anchor
type: rule
desc: PS比PB更少受杠杆与资产计价方式扭曲，行业PS中位数低意味着整个行业的收入被市场定价过便宜，故在半年均换手低于1%的冷门股中买所处行业PS锚最低的10只，持有60日或20日均换手回到2%以上（行业被追捧）兑现，10%止损且同行业最多5只。
buy:
- op: turn_ma_n
  n: 120
  dir: below
  threshold: 1
rank:
  op: ind_median_ps
  order: asc
sell:
- op: turn_ma_n
  n: 20
  dir: above
  threshold: 2
max_hold_days: 60
stop_loss: 10%
max_positions: 10
industry_cap: 5
