name: b_r1_s5_15_smallcap_deepdd
type: rule
desc: "小市值在60日深回撤（溃疡高于8%）后流动性折价被放大到极致，情绪修复时反弹弹性最大；优先取市值最小者，溃疡收敛到2%以下（弹性已释放）或持有20日、止损8%离场。"
buy:
- {op: ulcer_n, n: 60, dir: above, threshold: 8.0}
sell:
- {op: ulcer_n, n: 60, dir: below, threshold: 2.0}
rank: {op: size_ln, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 3
