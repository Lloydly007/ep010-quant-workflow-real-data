name: b_r1_s5_08_vol_reversal
type: rule
desc: "10日收益波动升破3%多是情绪冲击而非基本面变化，随后5日存在均值回复；只在PS低、有真实营收支撑的股票上做，波动回落到2%以下（情绪平复）或止损5%离场。"
buy:
- {op: vol_n, n: 10, dir: above, threshold: 3.0}
sell:
- {op: vol_n, n: 10, dir: below, threshold: 2.0}
rank: {op: ps_ttm, order: asc}
max_hold_days: 5
stop_loss: 5
max_positions: 10
industry_cap: 0
