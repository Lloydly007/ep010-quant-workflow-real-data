name: b_r1_s5_04_hot_turnover
type: rule
desc: "单日换手超5%代表边际资金真实进场，但高换手本身是投机溢价，只在PB最低的一批上做5日短打赚资金推动的估值修复；20日均换手升破5%（拥挤化）或止损5%离场。"
buy:
- {op: turn, dir: above, threshold: 5.0}
sell:
- {op: turn_ma_n, n: 20, dir: above, threshold: 5.0}
rank: {op: pb, order: asc}
max_hold_days: 5
stop_loss: 5
max_positions: 10
industry_cap: 3
