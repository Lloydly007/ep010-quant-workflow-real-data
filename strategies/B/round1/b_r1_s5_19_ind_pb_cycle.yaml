name: b_r1_s5_19_ind_pb_cycle
type: rule
desc: "行业PB中位数处于低位意味着整个门类被市场按周期底部定价，行业内个股随行业估值修复上涨且下行空间被行业锚限制；个股60日收益波动低于2%（底部盘整而非恐慌），按行业PB中位数从低到高取，60日日内振幅放大到5%以上或持有40日、止损8%离场。"
buy:
- {op: vol_n, n: 60, dir: below, threshold: 2.0}
sell:
- {op: atr_close_n, n: 60, dir: above, threshold: 5.0}
rank: {op: ind_median_pb, order: asc}
max_hold_days: 40
stop_loss: 8
max_positions: 10
industry_cap: 5
