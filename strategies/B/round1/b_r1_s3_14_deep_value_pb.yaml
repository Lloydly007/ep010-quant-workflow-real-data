name: b_r1_s3_14_deep_value_pb
type: rule
desc: PB最低的股票以净资产为锚、账面价值提供下行缓冲，安全边际来自清算价值的支撑，但低PB陷阱多出现在被反复博弈的拥挤标的上；先用20日均换手低于3%剔除拥挤，再在非拥挤集合内按PB升序取10只、持有40日，20日均换手升破5%（拥挤化）离场，止损10%。
buy:
- op: turn_ma_n
  n: 20
  dir: below
  threshold: 3.0
rank:
  op: pb
  order: asc
sell:
- op: turn_ma_n
  n: 20
  dir: above
  threshold: 5.0
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 3
