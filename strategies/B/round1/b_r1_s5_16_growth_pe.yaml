name: b_r1_s5_16_growth_pe
type: rule
desc: "市场愿意为高PE公司的成长预期付费，PE 高位本身是预期强度的度量而非风险，但只在日内振幅温和（ATR/收盘低于2%）的股票上买，避免把纯投机高估值当成长；按PE由高到低取（负PE亏损股自然排最后），振幅放大到8%以上（投机化）或持有40日、止损10%离场。"
buy:
- {op: atr_close_n, n: 60, dir: below, threshold: 2.0}
sell:
- {op: atr_close_n, n: 60, dir: above, threshold: 8.0}
rank: {op: pe_ttm, order: desc}
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 0
