name: b_r1_s5_01_turn_sweet_spot
type: rule
desc: "换手率与后续收益并非单调：换手过低说明无人关注、过高说明投机拥挤，处于1%~3%的适度关注区间时估值修复最顺；在行业PS中位数最低的门类里买入该区间标的，并限制同行业持仓以分散行业锚，单日换手升破8%（转入炒作）或持有20日、止损8%离场。"
buy:
- {op: turn, dir: above, threshold: 1.0}
- {op: turn, dir: below, threshold: 3.0}
sell:
- {op: turn, dir: above, threshold: 8.0}
rank: {op: ind_median_ps, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 5
