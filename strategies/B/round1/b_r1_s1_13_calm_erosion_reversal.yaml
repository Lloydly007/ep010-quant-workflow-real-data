name: b_r1_s1_13_calm_erosion_reversal
type: rule
desc: 20日波动低于2%却持续处在60日回撤中（溃疡高于5%）的“阴跌股”是被缓慢抽走流动性而非遭恐慌抛售，悲观预期缺乏催化因而积压，一旦短期回撤收敛（20日溃疡低于2%）即说明卖压耗尽、悲观定价修复，故买入回撤最深者并在收敛时离场
buy:
- {op: vol_n, n: 20, dir: below, threshold: 2}
- {op: ulcer_n, n: 60, dir: above, threshold: 5}
sell:
- {op: ulcer_n, n: 20, dir: below, threshold: 2}
rank: {op: ulcer_n, n: 60, order: desc}
max_hold_days: 40
stop_loss: 8
max_positions: 10
industry_cap: 3
