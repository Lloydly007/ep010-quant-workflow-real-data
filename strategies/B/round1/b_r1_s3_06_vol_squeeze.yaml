name: b_r1_s3_06_vol_squeeze
type: rule
desc: 近20日日收益波动低于2%说明多空分歧收敛、筹码在窄幅区间内沉淀，方向选择前的蓄势期往往随后出现估值修复；用250日波动时序分位只留自身上下文最安静的10只、持有20日，20日波动放大到5%（蓄势结束、方向已选）即离场，止损8%。
buy:
- op: vol_n
  n: 20
  dir: below
  threshold: 2.0
rank:
  op: ts_pct
  n: 250
  of:
    op: vol_n
    n: 20
  order: asc
sell:
- op: vol_n
  n: 20
  dir: above
  threshold: 5.0
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 0
