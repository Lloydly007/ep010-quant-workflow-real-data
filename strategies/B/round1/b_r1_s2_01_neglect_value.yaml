name: b_r1_s2_01_neglect_value
type: rule
desc: 60日均换手低于1%（本池换手中位仅约0.5%）的股票是被机构研究覆盖彻底遗漏的冷门股，关注度不足让价格长期低于内在价值、低PB提供安全边际，故在冷门股里按PB升序取最便宜的10只，持有40日或20日均换手回到3%以上（关注度回补）即兑现离场，10%止损。
buy:
- op: turn_ma_n
  n: 60
  dir: below
  threshold: 1
rank:
  op: pb
  order: asc
sell:
- op: turn_ma_n
  n: 20
  dir: above
  threshold: 3
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 0
