name: b_r1_s5_02_attention_turn
type: rule
desc: "60日均换手不足3%的冷门股突然单日换手超3%，说明关注度刚被触发而尚未被炒作，首次放量后20日内有超额；同条件里选PS更低者，20日均换手升破5%（关注度转入拥挤）或持有20日、止损8%离场。"
buy:
- {op: turn, dir: above, threshold: 3.0}
- {op: turn_ma_n, n: 60, dir: below, threshold: 3.0}
sell:
- {op: turn_ma_n, n: 20, dir: above, threshold: 5.0}
rank: {op: ps_ttm, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 0
