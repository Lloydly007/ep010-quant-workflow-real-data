name: b_r1_s3_16_pe_trough
type: rule
desc: 在银行钢铁电力这类周期股上，高PE往往是盈利处于周期底部的镜像（分母的盈利塌陷），市场对底部盈利过度外推、一旦盈利均值回归PE自然回落而股价上行；用20日波动低于3%确认这不是题材炒作，按PE降序取10只（PE≤0的亏损股自动排末位，等于只买还有正盈利的底部公司）、持有40日，20日波动破5%（逻辑转投机）离场，止损10%。
buy:
- op: vol_n
  n: 20
  dir: below
  threshold: 3.0
rank:
  op: pe_ttm
  order: desc
sell:
- op: vol_n
  n: 20
  dir: above
  threshold: 5.0
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 0
