name: b_r1_s5_11_deep_dd_repair
type: rule
desc: "一年维度溃疡指数高于15%说明估值已被压到极端，而大跌期PE常被一次性损益扭曲，故按PS（收入口径）最低取修复标的；下行风险仍高故设10%止损，近20日溃疡收敛到3%以下（修复完成）或持有40日离场。"
buy:
- {op: ulcer_n, n: 250, dir: above, threshold: 15.0}
sell:
- {op: ulcer_n, n: 20, dir: below, threshold: 3.0}
rank: {op: ps_ttm, order: asc}
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 0
