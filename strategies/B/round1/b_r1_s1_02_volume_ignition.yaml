name: b_r1_s1_02_volume_ignition
type: rule
desc: 20日均换手低于2%的沉寂个股单日换手突然放大到3%以上，是新增资金首次建仓而非存量博弈的痕迹，之后常有数周资金延续，故在放量当日按换手降序买入、5日均换手过热过8%即离场
buy:
- {op: turn_ma_n, n: 20, dir: below, threshold: 2}
- {op: turn, dir: above, threshold: 3}
sell:
- {op: turn_ma_n, n: 5, dir: above, threshold: 8}
rank: {op: turn, order: desc}
max_hold_days: 10
stop_loss: 8
max_positions: 10
industry_cap: 0
