name: b_r1_s2_15_pe_rerating
type: rule
desc: PE最高的票是市场愿意为其未来增长支付最多溢价的公司，估值扩张本身在盈利兑现之前有惯性，而亏损股PE为负会沉到降序排序末尾被自动排除，故在20日波动率低于2%的票里买PE最高的10只，波动率回到3%以上（重估转入博弈阶段）或20日到期离场，8%止损。
buy:
- op: vol_n
  n: 20
  dir: below
  threshold: 2
rank:
  op: pe_ttm
  order: desc
sell:
- op: vol_n
  n: 20
  dir: above
  threshold: 3
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
