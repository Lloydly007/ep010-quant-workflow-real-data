name: b_r1_s1_20_distress_reversal
type: rule
desc: 换手突然放大到3%以上说明市场正在重新定价，叠加极低PB意味着重定价方向向上、前期悲观预期被修正，故在高关注度的便宜股里按PB升序买入、持有到5日均换手回落到2%以下（关注度消退、重估结束）离场
buy:
- {op: turn, dir: above, threshold: 3}
sell:
- {op: turn_ma_n, n: 5, dir: below, threshold: 2}
rank: {op: pb, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 0
