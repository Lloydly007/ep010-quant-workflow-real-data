name: b_r1_s5_07_atr_squeeze
type: rule
desc: "ATR除以收盘连续20日低于2%说明日内振幅被压缩、筹码沉淀，方向选择前夜向上突破居多；选PS最低的标的，振幅放大到5%以上（行情已展开）或持有10日、止损8%离场。"
buy:
- {op: atr_close_n, n: 20, dir: below, threshold: 2.0}
sell:
- {op: atr_close_n, n: 20, dir: above, threshold: 5.0}
rank: {op: ps_ttm, order: asc}
max_hold_days: 10
stop_loss: 8
max_positions: 10
industry_cap: 0
