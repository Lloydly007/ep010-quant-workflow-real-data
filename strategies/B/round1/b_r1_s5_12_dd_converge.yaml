name: b_r1_s5_12_dd_converge
type: rule
desc: "近20日溃疡指数低于2%（几乎无回撤）且当日换手回到2%以上，是底部结构完成、资金回流的确认；在证监会门类内选相对PB最低者，溃疡重回5%以上或持有20日、止损8%离场。"
buy:
- {op: ulcer_n, n: 20, dir: below, threshold: 2.0}
- {op: turn, dir: above, threshold: 2.0}
sell:
- {op: ulcer_n, n: 20, dir: above, threshold: 5.0}
rank: {op: ind_rank, of: {op: pb}, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 3
