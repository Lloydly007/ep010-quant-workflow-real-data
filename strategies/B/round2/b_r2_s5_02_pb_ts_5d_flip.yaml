name: b_r2_s5_02_pb_ts_5d_flip
type: rule
desc: 现象：第1轮 B 路过 L2 的 29 份配置全部只做到「少亏」——便宜可以便宜很久，持仓全押在「估值总会修复」上，2018 年池内等权 -29% 就把收益抹平，它们缺的不是估值口径而是时点。为什么在 A 股该有超额：A 股情绪反转以 1 到 2 周为单位，自身估值分位极低时 5 日收益转正说明资金已经开始重新定价这只票，赔率(低分位)与胜率(已启动)同时具备。怎么进出：5 日收益 >1% 时买入，按自身 250 日 PB 分位升序取最便宜的 10 只，5 日收益跌破 -5%(启动失败)即离场，最长持有 10 日、止损 5%、同行业最多 3 只。改了什么：把第1轮「买便宜然后长期硬扛下跌」换成「低分位 + 短周期确认」，确认失败立刻撤，用对称进出替代无期限等待。
buy:
- {op: ret_n, n: 5, dir: above, threshold: 1}
sell:
- {op: ret_n, n: 5, dir: below, threshold: -5}
rank: {op: ts_pct, n: 250, of: {op: pb}, order: asc}
max_hold_days: 10
stop_loss: 5
max_positions: 10
industry_cap: 3
