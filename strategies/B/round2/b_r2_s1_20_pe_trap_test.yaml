name: b_r2_s1_20_pe_trap_test
type: rule
desc: 现象是PE（TTM）最低的一组在A股同时混着两种公司，一种是真正便宜的盈利股，另一种是报表亏损导致PE为负的困境股，按PE升序排序会把亏损股排在前面。本假设故意不做亏损剔除，用价格条件把风险控制住，专门检验「最便宜的PE」在A股究竟对应困境反转还是价值陷阱，这是一条第1轮完全没做的单点检验。进出为20日波动率低于3%且站上20日线两条件同时成立才买，10日涨幅超过8%或跌破20日线离场，持仓上限20日、止损8%。相对第1轮失败模式的改动：第1轮全部用PB与PS排序以回避负PE问题，PE维度等于没有检验；本版把PE当唯一排序键，让估值决定「买哪只」、量价决定「何时进出」，结论可直接判定低PE组以陷阱为主还是以反转为多。
buy:
- {op: vol_n, n: 20, dir: below, threshold: 3}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
sell:
- {op: ret_n, n: 10, dir: above, threshold: 8}
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: pe_ttm, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 5
