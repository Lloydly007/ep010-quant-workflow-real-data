name: b_r2_s1_11_smooth_lowpath
type: rule
desc: 现象是20日溃疡率低于2%（价格路径极平滑、几乎没有深回撤），但股价仍在60日高点下方10%以上，属于抛压枯竭却尚未被重估的横盘底部。A股缺乏做空机制，价格平滑意味着既没人恐慌抛售也没人获利了结，这类底部一旦出现增量资金，重估速度快于波动剧烈的股票。进出为路径平滑与低位横盘两条件同时成立才买，溃疡率升破5%（路径恶化）离场，持仓上限40日、止损8%。相对第1轮失败模式的改动：第1轮把低溃疡当防御指标（溃疡低就买并长期持有），没有和价格位置绑定，结果只是少亏；本版要求「平滑但仍在低位」，并在路径恶化时先走，估值只在平滑低位股里排序。
buy:
- {op: ulcer_n, n: 20, dir: below, threshold: 2}
- {op: dist_high_n, n: 60, dir: below, threshold: -10}
sell:
- {op: ulcer_n, n: 20, dir: above, threshold: 5}
rank: {op: ps_ttm, order: asc}
max_hold_days: 40
stop_loss: 8
max_positions: 10
industry_cap: 5
