name: b_r2_s2_13_score_small_quiet_cheap
type: score
desc: "现象：小市值 + 冷门 + 低 PB 的三维叠加，是“被市场讨厌到没人讨论且便宜”的组合。为什么在 A 股该有超额：低 PB 单独用只是少亏（第 1 轮结论），但与“无人交易”叠加时含义变了——它是“折价还没被修复”的必要条件，而不是“基本面差”的结果；加入小市值分位后收益来源是折价收敛而非质量，这也解释了第 1 轮低估值组为何只是少亏：缺了“无人交易”这个折价仍然存在的证据。怎么进出：月度首个交易日按 score = -0.4×市值截面分位 -0.4×20 日均换手截面分位 -0.2×PB 截面分位 排序取前 30，持有到下次调仓。相对第 1 轮失败模式改了什么：第 1 轮 rule 型把估值/规模/换手拆成三组独立假设（B 组最好也只有 +9.9% 超额、L3 全灭），仅有的 2 份 score 型做过合并但都自述“仅作风格倾斜诊断、不做选股能力声明”；本组第一次在 1,545 只池上把它们放进同一打分做真选股，检验“少亏”的估值能否在“被忽视”的条件下变成超额。"
