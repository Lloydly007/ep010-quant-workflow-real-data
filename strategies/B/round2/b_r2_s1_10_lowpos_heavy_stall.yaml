name: b_r2_s1_10_lowpos_heavy_stall
type: rule
desc: 现象是股价距250日高点仍有15%以上、当日换手放大到5%以上、但5日收益仍为负，即低位放量不涨。A股里高位放量下跌是出货，低位放量滞跌多是筹码在恐慌者与价值投资者之间换手，换手完成后常出现一段修复行情。进出为低位、高换手、5日下跌三条件同时成立才买，5日涨幅超过5%即兑现，持仓上限10日、止损10%。相对第1轮失败模式的改动：第1轮用换手率做买入条件时不分位置，把高位放量也一起买进来，这正是追高失败的来源；本版给换手加了「距250日高点15%以上」的位置约束，只买低位的放量换手，估值排序负责在低位股里挑最便宜的。
buy:
- {op: dist_high_n, n: 250, dir: below, threshold: -15}
- {op: turn, dir: above, threshold: 5}
- {op: ret_n, n: 5, dir: below, threshold: -3}
sell:
- {op: ret_n, n: 5, dir: above, threshold: 5}
rank: {op: pb, order: asc}
max_hold_days: 10
stop_loss: 10
max_positions: 10
industry_cap: 5
