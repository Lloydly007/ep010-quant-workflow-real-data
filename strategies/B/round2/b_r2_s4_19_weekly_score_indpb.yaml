name: b_r2_s4_19_weekly_score_indpb
type: score
desc: 现象是同业折价的收敛半衰期在A股很短（一到三周），月度调仓要等下个月才把已经收敛的仓位换掉，等于把alpha让给市场，而纯周度调仓又会被交易成本吃掉；折价修复是快变量、成本是慢变量，只在折扣最大的尾部做周度轮动，单次换手有限、成本可控，同时按周把修复收益收割。做法是打分型，行业内PB分位负权1.0、20日均换手负权0.4（低换手优先以压成本）、20日量比正权0.2（只买已经开始放量的折价股以免空等），周度首个交易日调仓持30只。相对第1轮改动：第1轮打分型的因子全是估值水平量，没有一份把“折价收敛速度”作为调仓频率的理由，这份的频率选择本身就是一个假设。
factors:
- {op: ind_rank, of: {op: pb}, weight: -1.0}
- {op: turn_ma_n, n: 20, weight: -0.4}
- {op: vol_ratio_n, n: 20, weight: 0.2}
holdings: 30
rebalance: weekly_first_trade_day
neut_industry: false
neut_size: false
