name: b_r2_s1_05_calm_breakout
type: rule
desc: 现象是20日新高突破若伴随失控量能（量比3倍以上、换手10%以上），在A股多数是情绪高潮而非启动；反过来温和放量（量比不足2倍、换手未过热）的突破缺乏跟风盘，往往还有第二段。追涨亏钱的原因不是突破本身，而是买在量能峰值，这一点第1轮A路已经验证。进出为突破20日高点、量比低于2倍、当日换手低于8%三条件才买，跌破10日线即走，持仓上限20日、止损8%。相对第1轮失败模式的改动：第1轮A路追涨类系统性买在放量高潮，B路又完全不用价格突破、只用冷门指标；本版保留突破但剔除量能失控的样本，再用估值排序在温和突破的股票里挑最便宜的。
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: vol_ratio_n, n: 5, dir: below, threshold: 2.0}
- {op: turn, dir: below, threshold: 8}
sell:
- {op: close_over_ma_n, n: 10, dir: below, threshold: 1.0}
rank: {op: pb, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 5
