name: b_r2_s4_16_bear_reverse_indpb
type: rule
desc: 现象是沪深300ETF跌破250日均线时市场进入负beta环境，此时同业最便宜的股票往往同时被砸出8%以上的路径伤害，形成便宜加深跌的双重条件；A股熊市反弹由超跌股领涨，行业内比价保证买到的是同业中最被抛弃的一只、弹性最大。这份与趋势开关那份方向相反，测的是熊市里做超跌折价，两者构成一组方向性对照。做法是ETF在250日均线下方、60日溃疡高于8%触发买入，按行业内PB分位升序取10只，收盘站上20日均线上方20%（反弹到位）或持满20日、亏8%离场，同行业最多3只。相对第1轮改动：第1轮B路在2018与2022的单边下行里全程满仓，从未把熊市当条件，这份把熊市本身变成入场的必要条件。
buy:
- {op: etf_above_ma_n, n: 250, dir: below, threshold: 0.5}
- {op: ulcer_n, n: 60, dir: above, threshold: 8}
rank: {op: ind_rank, of: {op: pb}, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.2}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 3
