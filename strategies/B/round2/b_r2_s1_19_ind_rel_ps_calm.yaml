name: b_r2_s1_19_ind_rel_ps_calm
type: rule
desc: 现象是在同一行业内PS最低（行业内分位排序），同时站上60日线、20日波动率低于2%，即同行业里销售端最便宜、走势又最稳的股票。A股同行业公司的会计口径与商业模式相近，行业内PS比较比跨行业PS比较可靠；低波加趋势确认把「便宜但已被抛弃」的样本剔除出去。进出为站上60日线与20日波动率低于2%两条件同时成立才买，溃疡率升破5%离场，持仓上限40日、止损8%。相对第1轮失败模式的改动：第1轮也有行业内PB与PS排序，但买入条件多是单一冷门指标、没有趋势与波动过滤，选出的常是同行业里正在杀估值的落后股；本版加趋势与低波双门槛，让行业内折价变成可交易的折价。
buy:
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
- {op: vol_n, n: 20, dir: below, threshold: 2}
sell:
- {op: ulcer_n, n: 20, dir: above, threshold: 5}
rank: {op: ind_rank, of: {op: ps_ttm}, order: asc}
max_hold_days: 40
stop_loss: 8
max_positions: 10
industry_cap: 5
