name: b_r2_s4_15_close_pos_low_indpb
type: rule
desc: 现象是收盘落在当日振幅下沿（close_pos_range低于0.5）说明尾盘有被动抛压，指数调仓、ETF申赎、券商强平都在收盘前执行，若这只票同时是同业PB最便宜的一端，尾盘砸出来的折价常在次日被抹掉；A股尾盘流动性与日内结构相关性强，日内弱势是短期错误定价的直接观测值，行业内比价保证这不是在买全市场最烂的票。做法是收盘位置低于0.5、60日均换手低于8%触发买入，按行业内PB分位升序取10只，5日收益超过8%（日内错价已修复）或持满10日、亏5%离场，同行业最多3只。相对第1轮改动：第1轮B路完全没有用日内结构零件，全部是日频以上的水平量，这份是唯一以“日内谁在卖”为假设的配置。
buy:
- {op: close_pos_range, dir: below, threshold: 0.5}
- {op: turn_ma_n, n: 60, dir: below, threshold: 8}
rank: {op: ind_rank, of: {op: pb}, order: asc}
sell:
- {op: ret_n, n: 5, dir: above, threshold: 8}
max_hold_days: 10
stop_loss: 5
max_positions: 10
industry_cap: 3
