name: b_r2_s4_18_trend250_filter_indpb
type: rule
desc: 现象是便宜不等于会修复，长期均线之下的便宜股常是下跌中继（价值陷阱），收盘价站上250日均线说明长期筹码已换手到愿意持有的资金手里，折价才有修复的载体；A股的价值陷阱主要来自景气下行与治理问题，250日均线是这两者在价格上的合成结果，用长期趋势做“是不是陷阱”的过滤器比用缺失的财务数据更现实。做法是收盘在250日均线上方、60日均换手低于8%触发买入，按行业内PB分位升序取10只，跌破250日均线（长期结构破坏）或持满40日、亏10%离场，同行业最多5只。相对第1轮改动：第1轮B路一律回避趋势零件（怕变成A路的追涨），但250日这种超长均线不是追涨而是陷阱过滤，这份把趋势信息用在排除而不是选择上。
buy:
- {op: close_over_ma_n, n: 250, dir: above, threshold: 1.0}
- {op: turn_ma_n, n: 60, dir: below, threshold: 8}
rank: {op: ind_rank, of: {op: pb}, order: asc}
sell:
- {op: close_over_ma_n, n: 250, dir: below, threshold: 1.0}
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 5
