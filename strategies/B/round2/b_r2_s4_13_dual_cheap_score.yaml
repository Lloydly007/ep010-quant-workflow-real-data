name: b_r2_s4_13_dual_cheap_score
type: score
desc: 现象是PB折价可能来自资产端的会计处理（商誉、投资性房地产、折旧年限），PS折价更接近经营层面被低估，只有两种口径在同业内都最便宜才是干净的相对折价；A股低PB组合长期吸纳银行地产钢铁等重资产行业，单一PB口径最容易买到资产重但不赚钱的公司，第1轮B路低PB组合L3全灭与此一致，用行业内PS分位做第二口径能把“资产便宜但收入没人要”的伪折价降权。做法是打分型，行业内PB分位负权1.0、行业内PS分位负权0.5、20日量比负权0.3（缩量优先）、20日均换手负权0.2（避开已被炒作的伪折价），开启市值5档内秩中性化（避免全挤在小盘、重复基准的市值结构），月度调仓持30只。相对第1轮改动：第1轮三口径打分混了行业内PB、截面PS、时序PS三个坐标系，这份两个估值口径都放在“行业内”同一坐标系，并用neut_size而不是再押小市值。
factors:
