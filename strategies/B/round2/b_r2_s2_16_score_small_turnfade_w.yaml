name: b_r2_s2_16_score_small_turnfade_w
type: score
desc: "现象：换手处在自身一年最低分位的小盘，是“关注度正在枯竭”的票——绝对换手低可能只是这只票天生冷，相对自身一年新低则说明它正在被加速遗忘。为什么在 A 股该有超额：A 股热度衰减有惯性，散户资金撤离后要一到两个季度才会被重新发现；在枯竭最快时买入、在关注度回补时卖出，赚的是注意力的均值回复；小市值分位保证买的不是大票的热度噪声。怎么进出：周度首个交易日按 score = -0.5×市值截面分位 -0.5×20 日均换手的 250 日时序分位 排序取前 30，持有到下周调仓。相对第 1 轮失败模式改了什么：第 1 轮 9 份 ts_pct 排序键里只有 2 份基值是换手（s2_07 的 turn、s3_02 的 turn_ma_n），且买入条件仍是绝对换手阈值——等于用分位排序、却用绝对门槛定候选集；本组把换手彻底换成时序分位倾斜并与规模同权，再用周度调仓缩短“枯竭—回补”的识别滞后，代价是换手成本上升，正好拿它检验第 1 轮的高换手损耗诊断。"
