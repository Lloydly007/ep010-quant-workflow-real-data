name: b_r2_s1_07_long_neglect_ignite
type: rule
desc: 现象是60日均换手低于3%的长期冷门股，某日换手突然放大到5%以上并收在振幅上半区，这是长期无人覆盖的股票第一次被资金注意到。A股冷门股信息扩散慢，首次异动的持续性明显好于已经热过几天的股票，此时估值排序能把资金导向真正便宜、又刚被发现的标的。进出为长窗冷清、当日异动、日内强收三条件同时成立才买，换手升破10%（情绪高潮）即卖，持仓上限10日、止损8%。相对第1轮失败模式的改动：第1轮用「当日换手高于3%」直接买异动，选出来的多是已经热了几天的股票，正是系统性买在高点的追高模式；本版用60日均换手做冷门门槛，只买第一次异动，并在情绪高潮而不是趋势破位时离场。
buy:
- {op: turn_ma_n, n: 60, dir: below, threshold: 3}
- {op: turn, dir: above, threshold: 5}
- {op: close_pos_range, dir: above, threshold: 0.5}
sell:
- {op: turn, dir: above, threshold: 10}
rank: {op: pb, order: asc}
max_hold_days: 10
stop_loss: 8
max_positions: 10
industry_cap: 5
