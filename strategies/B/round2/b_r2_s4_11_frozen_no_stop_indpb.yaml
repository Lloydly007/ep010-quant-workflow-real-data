name: b_r2_s4_11_frozen_no_stop_indpb
type: rule
desc: 现象是250日均换手不足1%意味着整整一年没有资金进出、流动性折价被压到极致；A股的流动性溢价极其极端，这种票上任何一笔买盘的价格冲击都被放大，折价一旦回归弹性远大于活跃股，而第1轮相同条件却用流通市值排序、等于再押一次小市值beta。做法是250日均换手低于1%、且沪深300ETF在250日均线上方才买入，按行业内PB分位升序取10只（组合集中在各行业里被彻底遗忘的便宜资产而不是小盘）；不设止损（价值回归需要时间，5%到10%的止损在流动性真空股上常打在底部），持满60日时间退出、不设行业上限。相对第1轮改动：同类配置死于“无止损加无市场开关”，这份保留无止损但补上市场开关，把尾部风险从个股移到市场层。
buy:
- {op: turn_ma_n, n: 250, dir: below, threshold: 1}
- {op: etf_above_ma_n, n: 250, dir: above, threshold: 0.5}
rank: {op: ind_rank, of: {op: pb}, order: asc}
max_hold_days: 60
max_positions: 10
industry_cap: 0
