desc: "现象：小市值 + 冷门 + 窄幅（60 日 ATR 低）的票，是“没有故事、没有波动、没有人交易”的三重沉默状态。为什么在 A 股该有超额：A 股这类票的波动率被压到极低后，一旦有事件（业绩、重组、行业政策）触发，短期涨幅远大于波动大的票，因为筹码换手成本低、上方套牢盘少；收益来源是在波动率最低点买入，与第 1 轮“追涨突破”完全相反。怎么进出：周度首个交易日按 score = -0.4×市值截面分位 -0.3×20 日均换手截面分位 -0.3×60 日 ATR 占比 排序取前 30，持有到下周调仓。相对第 1 轮失败模式改了什么：第 1 轮的 ATR 要么进买入条件（17 份含 atr_close_n）、要么直接当排序键（3 份），从未与市值分位、换手分位同时按权重竞争；本组让三个维度在一个打分里按权重出价，并用周度调仓缩短“沉默期结束”的识别滞后。"
