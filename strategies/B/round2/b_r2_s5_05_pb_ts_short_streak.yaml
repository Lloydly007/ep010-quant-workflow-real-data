name: b_r2_s5_05_pb_ts_short_streak
type: rule
desc: 现象：第1轮 B 路的短持有期配置(s1_02/s2_02/s5_04)全部押在「高换手放量」上，而 A 路 100 份趋势动量配置年化中位 -17.9%、超额中位 -25.4%，说明在 A 股追涨类信号系统性买在高点。为什么在 A 股该有超额：短持的收益不该来自追涨，而该来自低位启动——自身半年 PB 分位极低说明赔率还在，连续 4 日以上上涨说明第一波买盘已经出现，此时短打 10 日的胜率远高于在放量高位接力。怎么进出：连续上涨超过 3 日(至少 4 连阳)时买入，按自身 120 日 PB 分位升序取 10 只，不设卖出条件、满 10 日强制离场，止损 5%、同行业最多 3 只。改了什么：把短持有期从「高换手追涨」搬到「低估值分位 + 连阳启动」，直接针对第1轮的追高失败模式。
buy:
- {op: streak_up, dir: above, threshold: 3}
rank: {op: ts_pct, n: 120, of: {op: pb}, order: asc}
max_hold_days: 10
stop_loss: 5
max_positions: 10
industry_cap: 3
