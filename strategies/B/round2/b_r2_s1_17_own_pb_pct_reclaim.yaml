name: b_r2_s1_17_own_pb_pct_reclaim
type: rule
desc: 现象是个股PB处于自身过去250个交易日的最低区间（时序分位），同时5日量比超过1.5倍、当日强收、股价仍在250日高点下方10%以上，也就是自身估值底部加上放量收高，这是重估启动的典型组合。A股估值均值回归在个股自身历史上比在截面上更稳定，因为行业属性与会计口径没变；放量收高提供资金进场的证据，避免在阴跌里提前埋伏。进出为放量、强收、低位三条件同时成立才买，10日涨幅超过8%兑现，持仓上限20日、止损8%。相对第1轮失败模式的改动：第1轮用截面PB排序（比谁绝对便宜），选出的可能是长期便宜的行业；本版改用自身历史分位，让「相对自己的底部」决定排序，并要求量价启动确认，不确认不买。
buy:
- {op: vol_ratio_n, n: 5, dir: above, threshold: 1.5}
- {op: close_pos_range, dir: above, threshold: 0.8}
- {op: dist_high_n, n: 250, dir: below, threshold: -10}
sell:
- {op: ret_n, n: 10, dir: above, threshold: 8}
rank: {op: ts_pct, n: 250, of: {op: pb}, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 5
