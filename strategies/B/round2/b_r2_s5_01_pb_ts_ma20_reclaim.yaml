name: b_r2_s5_01_pb_ts_ma20_reclaim
type: rule
desc: 现象：绝对 PB 便宜的票多半处在持续阴跌里——第1轮 B 路 s1_15/s3_14 用绝对 PB 升序、买入条件只看回撤浅或换手低，等于买「便宜且还在跌」，结果 100 份里超额中位 -5.8%、最好也只有 +9.9%，跑不赢等权全池 +15.11%。为什么在 A 股该有超额：估值均值回归的收益来自「便宜被重新定价」的那一段，而不是便宜本身；收盘站上 20 日均线是买盘已经回流的第一个可观测证据，把静态赔率变成动态启动。怎么进出：只买自身 250 日 PB 分位最低、且当日收盘站上 20 日均线的票，按自身 PB 分位升序取 10 只，20 日均换手回到 5% 以上(关注度回补、折价收敛完成)或满 20 日离场，止损 8%。改了什么：把第1轮的「绝对低估值 + 静态冷门」换成「自身历史分位极低 + 价格结构已回升」，只买已经开始修的便宜货。
buy:
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
sell:
- {op: turn_ma_n, n: 20, dir: above, threshold: 5}
rank: {op: ts_pct, n: 250, of: {op: pb}, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 0
