name: b_r2_s1_08_climax_then_dry
type: rule
desc: 现象是20日溃疡率超过10%（抛售高潮已经发生）之后，5日量能萎缩到前5日均量一半以下、收盘重新站上10日线，构成放量、缩量、收复短均线的三段式结束信号。A股恐慌抛售通常就在这三个阶段完成，第三段买入的胜率明显高于第一段，低PS股在抛售结束后估值修复的空间最大。进出为三条件依次成立才买，10日涨幅超过8%兑现，持仓上限20日、止损8%。相对第1轮失败模式的改动：第1轮把「深回撤」本身当买点（溃疡率高就买），常常买在下跌中段，且卖出也挂在溃疡率上，回撤与反弹用同一个慢变量；本版要求高潮之后必须再看到缩量与短均线收复，估值只用于在确认后的样本里排序。
buy:
- {op: ulcer_n, n: 20, dir: above, threshold: 10}
- {op: vol_ratio_n, n: 5, dir: below, threshold: 0.5}
- {op: close_over_ma_n, n: 10, dir: above, threshold: 1.0}
sell:
- {op: ret_n, n: 10, dir: above, threshold: 8}
rank: {op: ps_ttm, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 5
