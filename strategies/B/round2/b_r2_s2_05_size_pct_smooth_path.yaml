name: b_r2_s2_05_size_pct_smooth_path
type: rule
desc: "现象：60 日回撤路径平方均值（ulcer）<8%（分布最平滑的两成）的小盘，是“被忘记”而不是“被抛弃”的票：筹码没有集中抛压，价格是阴跌而非踩踏。为什么在 A 股该有超额：踩踏式下跌伴随流动性冲击与强制平仓，修复极慢；路径平滑说明卖压分散且已释放，资金回来时修复更顺；平滑度与市值分位叠加，等于在“没人卖的小票”里挑最不容易被流动性冲击打穿的。怎么进出：ulcer(60) <8% 过滤，按市值截面分位升序取前 10，industry_cap=5；ulcer(20) 恶化到 10% 以上（开始踩踏）立即卖出；最长 60 日，5% 止损。相对第 1 轮失败模式改了什么：第 1 轮 s2_17 用 ulcer(120) <5% + 绝对 size_ln 排序，条件极紧、候选极少，本质是“长窗口 + 严阈值”的小样本抽样；本组把窗口缩到 60 日、阈值放到 8% 让候选集有足够宽度，并把止损从 8% 收紧到 5%——用退出规则而不是更严的入场阈值控制风险，这是对第 1 轮“硬阈值把候选压死、结果不可复现”的直接修正。"
buy:
- op: ulcer_n
  n: 60
  dir: below
  threshold: 8
rank:
  op: xsec_pct
  of:
    op: size_ln
  order: asc
sell:
- op: ulcer_n
  n: 20
  dir: above
  threshold: 10
max_hold_days: 60
stop_loss: 5%
max_positions: 10
industry_cap: 5
