name: b_r2_s1_06_uptrend_pullback_cheap
type: rule
desc: 现象是站在60日线上方的低PS股，5日回调超过3%而20日波动率仍低于3%，即缩量回踩。A股上涨趋势里的大幅回撤多由情绪而非基本面触发，缩量说明筹码没有松动，估值便宜的标的在回踩结束后修复更快、回撤更浅。进出为站上60日线、5日跌幅超过3%、20日波动率低于3%三条件才买，跌破20日线离场，持仓上限20日、止损8%。相对第1轮失败模式的改动：第1轮要么追突破（买在高点）、要么只买冷门（错过趋势），没有一条配置在趋势中回踩买入；本版用「趋势还在、价格回调、估值便宜」取代追涨与纯粹冷门，进出全部由价格结构决定。
buy:
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
- {op: ret_n, n: 5, dir: below, threshold: -3}
- {op: vol_n, n: 20, dir: below, threshold: 3}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ps_ttm, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 5
