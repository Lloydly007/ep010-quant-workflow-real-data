name: b_r2_s2_19_quiet_exit_on_path_decay
type: rule
desc: "现象：冷门股若按“换手回升”卖，会把“关注度正常化”误判成“拥挤”——很多票换手从 0.5% 回到 2% 只是恢复常态，卖了就错过主升；第 1 轮 82 份带卖出条件的配置里有 60 份的卖出零件与买入零件是同一个（同维度反向阈值），另有 18 份干脆没有卖出条件。为什么在 A 股该有超额：冷门股真正的风险不是换手回升，而是阴跌转踩踏（路径恶化），后者才是基本面破位或流动性撤退的信号；用路径恶化作卖出条件，等于让盈利单继续跑、只在结构破坏时退出，这直接对抗第 1 轮买卖同维度阈值回摆造成的高换手损耗。怎么进出：60 日均换手 <2% 过滤，按行业内市值分位升序取前 10，industry_cap=5；60 日 ulcer 恶化到 15% 以上（踩踏开始）卖出；最长 60 日，10% 止损。相对第 1 轮失败模式改了什么：第 1 轮唯一做过“买入看关注度、卖出看路径”配对的是 s1_14（ulcer(20)>10 + cap 5，只 1 份）；本组把它做成纯双维度版本（60 日 ulcer + 行业上限 5 + 最长持有 60 日），用于单独测量“卖点设计”对搜索期年化超额的贡献——这是第 1 轮从未被隔离检验过的变量。"
buy:
- op: turn_ma_n
  n: 60
  dir: below
  threshold: 2
rank:
  op: ind_rank
  of:
    op: size_ln
  order: asc
sell:
- op: ulcer_n
  n: 60
  dir: above
  threshold: 15
max_hold_days: 60
stop_loss: 10%
max_positions: 10
industry_cap: 5
