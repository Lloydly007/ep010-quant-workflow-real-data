name: b_r2_s1_15_etf_bear_panic
type: rule
desc: 现象是沪深300ETF在250日线下方（熊市）期间，个股5日跌幅超过8%而当日收在振幅上半区，即急跌当天的日内反抽。A股熊市反弹的弹性来自超跌与空头回补，低PS股在指数年线下方的反弹幅度通常大于指数本身，因为杀估值先杀故事、销售仍在的公司最先被捡回。进出为ETF年线下方、5日跌幅超过8%、当日收在上半区三条件同时成立才买，5日涨幅超过5%即兑现，持仓上限10日、止损5%。相对第1轮失败模式的改动：第1轮没有任何市场状态条件，熊市里照常买入并持有，把反弹做成了趋势；本版明确这是逆势短打，用ETF年线确认熊市、用5日兑现和5%止损把单笔敞口压到最小，估值排序只决定买哪只超跌股。
buy:
- {op: etf_above_ma_n, n: 250, dir: below, threshold: 0.5}
- {op: ret_n, n: 5, dir: below, threshold: -8}
- {op: close_pos_range, dir: above, threshold: 0.5}
sell:
- {op: ret_n, n: 5, dir: above, threshold: 5}
rank: {op: ps_ttm, order: asc}
max_hold_days: 10
stop_loss: 5
max_positions: 10
industry_cap: 0
