name: b_r2_s2_01_size_pct_turn_dry
type: rule
desc: "现象：60 日均换手低于 1% 的票已落在全池最冷的三成多（2014-2022 该指标中位数约 1.3%）；第 1 轮同类前身把“冷门”定在更短量级上（s1_12 用单日换手 <1%、s2_08 用 20 日均换手 <1%），单日口径会被一两次无意义成交打穿，20 日口径在牛市里仍能达标，等于“冷门”随行情自动放松。为什么在 A 股该有超额：A 股信息扩散由成交量驱动，连续三个月都没量的票才是真的关注度真空，价格只反映最悲观边际卖方的报价，一旦有并购/资产注入/行业景气外溢就会一次性重估；这与第 1 轮 A 路“放量突破才买”恰好相反——在无量时买、在放量那天卖。怎么进出：60 日均换手 <1% 过滤，按流通市值截面分位（xsec_pct of size_ln；与绝对市值同序，改分位口径是为了让“小”在跨年份尺度上可比）升序取最冷门的 10 只；单日换手 >8%（约 97 分位）视为关注度涌回、兑现离场；最长 60 日，10% 止损。相对第 1 轮失败模式改了什么：本组把“冷门的度量窗口”本身当成被检验的变量（60 日结构性 vs 第 1 轮的单日/20 日），并把持有期从 20 日拉到 60 日以压低第 1 轮暴露的换手成本；第 1 轮 L3 全灭指向条件随市场状态漂移，长窗口是抗漂移的一阶修正。"
buy:
- op: turn_ma_n
  n: 60
  dir: below
  threshold: 1
rank:
  op: xsec_pct
  of:
    op: size_ln
  order: asc
sell:
- op: turn
  dir: above
  threshold: 8
max_hold_days: 60
stop_loss: 10%
max_positions: 10
industry_cap: 0
