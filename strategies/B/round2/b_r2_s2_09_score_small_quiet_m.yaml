name: b_r2_s2_09_score_small_quiet_m
type: score
desc: "现象：第 1 轮 100 份里 98 份是 rule 型，做法是“绝对换手阈值硬筛 + 单一排序键”，两个缺陷同时存在——阈值在不同年份含义完全不同（2015 全市场换手高、2018 低），排序又只有一维，选出来的是“最小市值”而不是“小而冷”；仅有的 2 份 score 型还都按“30 只池、选股退化”的旧口径自我限缩成“风格倾斜诊断”。为什么在 A 股该有超额：小市值与被忽视是两个独立的风险补偿来源（换手与 ln(流通市值) 相关系数约 -0.1，二者不冗余），放进同一个连续打分后入选带宽随市场整体水平自动漂移，不再踩在固定阈值上。怎么进出：月度首个交易日按 score = -0.5×市值截面分位 -0.5×20 日均换手截面分位 排序取前 30（本池 1,545 只，holdings=30 是真选择而不是全池买入），持有到下次调仓。相对第 1 轮失败模式改了什么：把“硬阈值 + 单键 rank”改成“双分位倾斜”，是对第 1 轮失败模式最直接的结构性修改；第 1 轮不用 score 的理由是预算按 30 只池假设（选股退化），而实际池是 1,545 只，score 型是本轮才真正可用的形态。"
factors:
- op: xsec_pct
  of:
    op: size_ln
  weight: -0.5
- op: xsec_pct
  of:
    op: turn_ma_n
    n: 20
  weight: -0.5
