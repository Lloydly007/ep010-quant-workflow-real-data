name: b_r2_s4_06_largecap_rerate_score
type: score
desc: 现象是行业内便宜的股票里，小市值那一半的便宜常是流动性与壳价值噪声，大市值的同业折价才需要机构资金来重估；A股的机构定价偏好可容纳规模的大盘股、且大盘股的beta不低，第1轮已证明小市值倾斜几乎等于复制等权基准（等权全池年化15.11%，基准本身就是等权小盘结构），超额必须来自基准之外，而大盘股在2017与2019有独立于小盘的行情，正好补上L3要的超额稳定性。做法是打分型，行业内PB分位负权1.0、流通市值对数正权0.5、20日量比正权0.3（放量优先、避免死水票）、20日均换手正权0.3（有资金关注才可能被重估），月度调仓持30只。相对第1轮改动：第1轮B路要么全小市值（在复制基准）、要么纯低波（砍beta），这份第一次把“大市值加同业折价”作为收益源。
factors:
- {op: ind_rank, of: {op: pb}, weight: -1.0}
- {op: size_ln, weight: 0.5}
- {op: vol_ratio_n, n: 20, weight: 0.3}
- {op: turn_ma_n, n: 20, weight: 0.3}
holdings: 30
rebalance: monthly_first_trade_day
