name: b_r2_s1_18_ind_cheap_repair
type: rule
desc: 现象是所属行业PB中位数处在全市场最低端，而个股已站上20日线、换手仍低于2%，属于便宜行业里先止跌的品种。A股行业估值修复通常同时从龙头与低关注度个股启动，行业估值锚决定修复空间、个股均线决定时点，两者错位时先买行业便宜且个股先动的。进出为站上20日线与20日均换手低于2%两条件同时成立才买，跌破20日线离场，持仓上限40日、止损8%。相对第1轮失败模式的改动：第1轮把行业估值锚直接当买入理由（行业便宜就买），结果买在行业下跌中段；本版只把行业估值当排序键，进场交给个股价格确认，行业再便宜、个股没止跌也不买。
buy:
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
- {op: turn_ma_n, n: 20, dir: below, threshold: 2}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ind_median_pb, order: asc}
max_hold_days: 40
stop_loss: 8
max_positions: 10
industry_cap: 5
