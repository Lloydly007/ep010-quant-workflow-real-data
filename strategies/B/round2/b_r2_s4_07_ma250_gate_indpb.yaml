name: b_r2_s4_07_ma250_gate_indpb
type: rule
desc: 现象是等权全池2014年加56%、2015年加82%、2018年减29%、2022年减11%，同一个便宜股组合在牛熊里的超额符号完全相反，而第1轮B路没有一份做市场状态判断，年份分布与超额回撤都被单边下行年份吃掉；A股beta波动远大于价值因子的截面spread，先关掉下跌市的beta暴露、再在上涨市里做同业比价，超额才只在有正beta的环境里累积。做法是沪深300ETF在250日均线上方才允许买入，同时要求60日均换手低于8%，按行业内PB分位升序取10只，ETF跌破250日均线即全部卖出（卖出条件用市场级零件），持满60日或亏10%止损，同行业最多3只。相对第1轮改动：第1轮B路完全没用过ETF均线择时（etf_above_ma_n 这个市场级零件），这份把市场状态作为唯一的择时层。
buy:
- {op: etf_above_ma_n, n: 250, dir: above, threshold: 0.5}
- {op: turn_ma_n, n: 60, dir: below, threshold: 8}
rank: {op: ind_rank, of: {op: pb}, order: asc}
sell:
- {op: etf_above_ma_n, n: 250, dir: below, threshold: 0.5}
max_hold_days: 60
stop_loss: 10
max_positions: 10
industry_cap: 3
