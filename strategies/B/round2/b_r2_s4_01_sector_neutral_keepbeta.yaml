name: b_r2_s4_01_sector_neutral_keepbeta
type: rule
desc: 现象是行业内PB分位剥掉行业估值中枢后只剩同业比价，但第1轮B路凡叠加低波、低换手、大市值的配置都被等权全池的2014与2015行情按住（L2过29份、L3全灭）；A股等权基准本身是高beta组合，任何系统性砍beta的筛选只会把超额变成负的风格暴露，只做行业内比价、保留池子的波动结构，超额才来自个股折价。做法是60日均换手低于8%只剔极端投机票、60日波动高于2%剔死水股以保住beta，按行业内PB分位升序取10只，持20日、亏10%止损、同行业最多3只。相对第1轮改动：撤掉全部防御性筛选，把“少亏”背后的beta代价明确列为L3失败主因。
buy:
- {op: turn_ma_n, n: 60, dir: below, threshold: 8}
- {op: vol_n, n: 60, dir: above, threshold: 2}
rank: {op: ind_rank, of: {op: pb}, order: asc}
max_hold_days: 20
stop_loss: 10
max_positions: 10
industry_cap: 3
