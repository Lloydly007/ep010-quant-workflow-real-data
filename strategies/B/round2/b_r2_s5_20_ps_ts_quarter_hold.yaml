name: b_r2_s5_20_ps_ts_quarter_hold
type: rule
desc: 现象：第1轮 s1_17 用了同样的自身 PS 分位 + 无止损 + 60 日持有，但买入条件只是「5 日均换手低于 2%」——把没人交易当成了便宜，于是在继续阴跌的票里长期锁仓。为什么在 A 股该有超额：估值修复是慢变量，需要给足时间，但进场必须有中期确认——收盘站上 60 日均线且近月回撤 <5%，说明下跌结构已经走完；此时用自身 PS 分位挑最便宜的 10 只，等于「已经转势 + 仍然便宜」，而止损反而会在最后一跌里把复利洗掉。怎么进出：收盘站上 60 日均线且 20 日溃疡 <5% 时买入，按自身 250 日 PS 分位升序取 10 只，不设卖出条件、满 60 日强制离场、不设止损，同行业最多 5 只。改了什么：保留第1轮 s1_17 的低分位长持有无止损框架，但把静态冷门条件换成中期回升确认，验证第1轮缺的是时点而不是耐心。
buy:
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
- {op: ulcer_n, n: 20, dir: below, threshold: 5}
rank: {op: ts_pct, n: 250, of: {op: ps_ttm}, order: asc}
max_hold_days: 60
stop_loss: null
max_positions: 10
industry_cap: 5
