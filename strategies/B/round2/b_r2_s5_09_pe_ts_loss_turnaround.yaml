name: b_r2_s5_09_pe_ts_loss_turnaround
type: rule
desc: 现象：供应商 peTTM 有 10.2% 为负，PE 自身分位的最低端几乎全是盈利塌陷或转亏的公司；第1轮 s3_16/s2_15 用绝对 PE 高低找周期底与成长溢价，正好绕开这段最脏的数据，也就从没检验过「PE 分位极低」能不能交易。为什么在 A 股该有超额：A 股困境反转的第一波是价格先转向、盈利后修复，所以 PE 分位极低必须配价格确认——收盘站上 20 日均线说明市场已经在给盈利见底定价，这是纯低 PE 排序没有的信息。怎么进出：收盘站上 20 日均线时买入，按自身 250 日 PE 分位升序取 10 只(承认会买到亏损股，故止损放到 10%、持有压到 20 日)，20 日均换手破 8%(反转被炒作)或满 20 日离场。改了什么：第1轮用绝对 PE 做因子，本份改用自身历史分位并加价格确认，同时把负 PE 的数据污染写进假设而不是假装不存在。
buy:
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
sell:
- {op: turn_ma_n, n: 20, dir: above, threshold: 8}
rank: {op: ts_pct, n: 250, of: {op: pe_ttm}, order: asc}
max_hold_days: 20
stop_loss: 10
max_positions: 10
industry_cap: 5
