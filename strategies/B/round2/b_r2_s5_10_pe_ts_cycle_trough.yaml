name: b_r2_s5_10_pe_ts_cycle_trough
type: rule
desc: 现象：在银行钢铁电力航空地产这类周期股上，PE 自身分位的高位往往不是变贵，而是盈利塌到周期底导致分母塌陷；第1轮没有任何配置检验这个镜像方向，只在一端押注。为什么在 A 股该有超额：周期股戴维斯双击的起点正是「盈利在底部 + 价格开始回升」，此时 PE 分位高、PB 分位低；用自身 PE 分位降序(正 PE 在高位，亏损股的负 PE 自然沉到末位被排除)，再要求 60 日涨幅 >5% 确认市场已相信盈利见底。怎么进出：60 日收益 >5% 时买入，按自身 250 日 PE 分位降序取 10 只，20 日溃疡破 10%(周期二次探底)或满 40 日离场，止损 10%、同行业最多 5 只。改了什么：与第 9 份构成同一估值分位口径上的低分位与高分位对照，回答第1轮没回答的问题——PE 分位该低买还是高买；两份都保留「回升」这一必要条件。
buy:
- {op: ret_n, n: 60, dir: above, threshold: 5}
sell:
- {op: ulcer_n, n: 20, dir: above, threshold: 10}
rank: {op: ts_pct, n: 250, of: {op: pe_ttm}, order: desc}
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 5
