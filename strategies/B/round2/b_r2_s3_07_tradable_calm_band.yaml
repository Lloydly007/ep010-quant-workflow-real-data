name: b_r2_s3_07_tradable_calm_band
type: rule
desc: 现象：极低波+低PB的集合里混着大量僵尸股，日均换手不到1%，买不进也卖不出，折价永远修复不了，还可能踩退市。为什么该有超额：折价能被修复的前提是有真实对手盘；把可交易性当硬约束后剩下的是"冷而不死"的便宜股，一旦有资金进场，弹性远大于僵尸股。怎么进出：300ETF站上60日线、20日均换手高于1%、vol_n(60)<2时才买，按PB升序取10只；20日均换手升破5%（拥挤化）即卖，持有40日，10%止损。相对第1轮：round1把低换手当机会（turn_ma_n below 1 反复出现），这里把它当风险，是一个正面对立的假设。
buy:
- op: vol_n
  n: 60
  dir: below
  threshold: 2
- op: turn_ma_n
  n: 20
  dir: above
  threshold: 1
- op: etf_above_ma_n
  n: 60
  dir: above
  threshold: 0.5
rank:
  op: pb
  order: asc
sell:
- op: turn_ma_n
  n: 20
  dir: above
  threshold: 5
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 5
