name: b_r2_s1_13_lowvol_trend_gate
type: rule
desc: 现象是120日波动率低于2%且价格站在120日线上方，这是低波异象在A股唯一稳定的形态——低波只有在趋势向上时才赚到钱，脱离趋势的低波只是慢跌。A股低波股（银行、公用事业、交运）在利率下行与避险阶段被资金持续配置，趋势确认后的回撤远小于题材股，是压低超额回撤的关键。进出为长窗低波与站上120日线两条件同时成立才买，跌破60日线离场，持仓上限60日、止损8%。相对第1轮失败模式的改动：第1轮的低波配置只按波动率排序买入、没有趋势门槛，在2016与2018的下跌段照样满仓，超额回撤压不住所以L3全灭；本版给低波异象装上趋势开关，并用PB排序在低波股里选最便宜的。
buy:
- {op: vol_n, n: 120, dir: below, threshold: 2}
- {op: close_over_ma_n, n: 120, dir: above, threshold: 1.0}
sell:
- {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
rank: {op: pb, order: asc}
max_hold_days: 60
stop_loss: 8
max_positions: 10
industry_cap: 5
