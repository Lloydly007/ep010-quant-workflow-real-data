name: b_r2_s1_16_etf_bear_reclaim
type: rule
desc: 现象是指数还在60日线下方（弱势市场）时，仍有股票站上20日线且换手极低，说明有独立资金在照顾这类低关注度的便宜股。A股弱市里的结构性机会集中在少数低估值、低关注度的品种上，它们不需要指数配合就能修复，而一旦指数转强这类股票又会成为补涨主力。进出为ETF在60日线下方、个股站上20日线、20日均换手低于2%三条件同时成立才买，跌破20日线离场，持仓上限20日、止损8%。相对第1轮失败模式的改动：第1轮既没有区分市场状态，也没有用个股自身均线确认止跌；本版把「弱市里仍能止跌的冷门便宜股」单独作为一种假设，与多头市场版本（s1_14）形成对照，同一估值排序在两个市场状态下分别受检。
buy:
- {op: etf_above_ma_n, n: 60, dir: below, threshold: 0.5}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
- {op: turn_ma_n, n: 20, dir: below, threshold: 2}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: pb, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 5
