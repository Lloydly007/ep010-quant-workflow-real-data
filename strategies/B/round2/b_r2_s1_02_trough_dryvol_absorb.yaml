name: b_r2_s1_02_trough_dryvol_absorb
type: rule
desc: 现象是股价贴着20日低点、5日量能萎缩到前5日均量一半以下、当日收盘又落在振幅上半区，抛压枯竭而仍有承接，这是底部换手的典型一日。A股高换手均值回归，缩量贴底往往对应最后一次洗盘，此后1至3周的反弹由空头回补驱动，低PS股因为销售端仍有基本盘、估值修复弹性更大。进出为三条同时成立才买，量能放大到1.5倍即视为兑现离场，持仓上限20日、止损8%。相对第1轮失败模式的改动：第1轮用「低换手或低波动」单条件买入，不看价格位置与日内结构，会在下跌中段反复接刀；本版把量能萎缩、贴底、日内承接三件事绑成一个条件，并把卖点从慢变量改成放量兑现，估值排序只用于在确认后挑最便宜的。
buy:
- {op: vol_ratio_n, n: 5, dir: below, threshold: 0.5}
- {op: dist_low_n, n: 20, dir: below, threshold: 2}
- {op: close_pos_range, dir: above, threshold: 0.5}
sell:
- {op: vol_ratio_n, n: 5, dir: above, threshold: 1.5}
rank: {op: ps_ttm, order: asc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 5
