name: b_r2_s4_02_turn_sweet_band_pb
type: rule
desc: 现象是换手率与后续收益不单调——低于1%是流动性陷阱（买得进卖不出），高于8%是题材博弈的拥挤端，2%到5%的20日均换手才是真实交易与投机并存的地带；A股散户占比高，换手是关注度的直接代理，折价只有在有人开始交易时才会收敛，纯低换手筛选买到的多是流动性折价而不是被错杀的价值。做法是20日均换手严格落在2%到5%区间，按行业内PB分位升序取10只，10日均换手破8%（投机化）或持满20日、亏8%离场，同行业最多3只。相对第1轮改动：把“低换手”从目标改成有上下限的约束带，第1轮多次用below 1/2/3/5的单边低换手，等于把流动性陷阱当便宜。
buy:
- {op: turn_ma_n, n: 20, dir: above, threshold: 2}
- {op: turn_ma_n, n: 20, dir: below, threshold: 5}
rank: {op: ind_rank, of: {op: pb}, order: asc}
sell:
- {op: turn_ma_n, n: 10, dir: above, threshold: 8}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 3
