name: b_r2_s3_05_own_pct_gate
type: rule
desc: 现象：A股估值中枢十年漂移（同一批银行PB从1.2跌到0.5），绝对PB的跨期、跨股比较都会失真。为什么该有超额：均值回归资金真正锚定的是"相对自己五年最便宜"，这是散户与险资再平衡共同使用的参照点；同时用250日波动筛出结构性平静，而不是一次事件后的余波。怎么进出：300ETF站上60日线时买vol_n(250)<2的股票、按自身250日PB时序分位升序取10只；300ETF跌破60日线清仓，持有60日，10%止损。相对第1轮：round1的ts_pct只包单一因子且从不配市场状态，波动窗口最长60日，覆盖不到"结构性低波"。
buy:
- op: vol_n
  n: 250
  dir: below
  threshold: 2
- op: etf_above_ma_n
  n: 60
  dir: above
  threshold: 0.5
rank:
  op: ts_pct
  n: 250
  of:
    op: pb
  order: asc
sell:
- op: etf_above_ma_n
  n: 60
  dir: below
  threshold: 0.5
max_hold_days: 60
stop_loss: 10
max_positions: 10
industry_cap: 5
