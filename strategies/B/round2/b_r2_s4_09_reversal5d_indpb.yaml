name: b_r2_s4_09_reversal5d_indpb
type: rule
desc: 现象是5日跌超8%的同业最便宜股多数是流动性冲击（指数调仓、赎回、大股东减持的被动卖出）而不是信息事件，真正的坏消息会让它不再是同业最便宜；A股短期反转效应强、过度反应明显，行业内比价把“跌了但没变差”与“跌了因为变差”分开，比第1轮的全市场博反弹更接近错误定价本身。做法是5日收益低于-8%、60日均换手低于8%触发买入，按行业内PB分位升序取10只，收盘回到20日均线上方（脉冲修复完成）或持满10日、亏5%离场，同行业最多3只。相对第1轮改动：第1轮B路的反转类配置用绝对PS或自身溃疡排序，买的是全市场最惨的一群，这里用行业内PB分位把“惨”限定在同业比价里。
buy:
- {op: ret_n, n: 5, dir: below, threshold: -8}
- {op: turn_ma_n, n: 60, dir: below, threshold: 8}
rank: {op: ind_rank, of: {op: pb}, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
max_hold_days: 10
stop_loss: 5
max_positions: 10
industry_cap: 3
