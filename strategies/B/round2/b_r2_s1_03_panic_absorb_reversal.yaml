name: b_r2_s1_03_panic_absorb_reversal
type: rule
desc: 现象是连跌4天以上、20日溃疡率已超过8%（确有跌幅），当日却收在振幅最高10%附近，说明恐慌盘在尾盘被吸收。A股的跌停板与T+1放大了恐慌日的一次性抛售，次日多是空头回补，而低PB股由于净资产托底，回补幅度通常高于高估值股。进出为三条同时成立才买，5日涨幅超过5%即兑现，持仓上限10日、止损8%。相对第1轮失败模式的改动：第1轮B路没有任何配置使用日内收盘位置，卖点全是换手、波动这类慢变量，等信号走坏反弹早已结束；本版用「深跌+当日强收」捕捉投降日，用短周期兑现锁住反弹，估值只负责在恐慌股里挑资产最便宜的。
buy:
- {op: streak_down, dir: above, threshold: 3}
- {op: close_pos_range, dir: above, threshold: 0.8}
- {op: ulcer_n, n: 20, dir: above, threshold: 8}
sell:
- {op: ret_n, n: 5, dir: above, threshold: 5}
rank: {op: pb, order: asc}
max_hold_days: 10
stop_loss: 8
max_positions: 10
industry_cap: 5
