name: b_r2_s2_11_score_dual_ts_pct
type: score
desc: "现象：绝对市值与绝对换手都是跨股票的横向比较，会把“一只票相对自己一年前已经缩水一半、热度掉到自身历史最低”这类信息完全丢掉。为什么在 A 股该有超额：个股错价更多是相对自身历史的错价——同一只票在自己估值/热度低点买入的胜率高于“全市场最小”；双时序分位把规模与冷门都换成“相对自身”的口径，选股从风格赌注变成个股择时，再叠加低波过滤掉仍在剧烈定价的票。怎么进出：月度首个交易日按 score = -0.4×市值 250 日时序分位 -0.3×20 日均换手 250 日时序分位 -0.3×60 日波动 排序取前 30，持有到下次调仓。相对第 1 轮失败模式改了什么：这是本组唯一完全不用绝对规模与绝对换手的配置，同时对冲第 1 轮“绝对阈值 + 绝对市值排序”的双重弱点；若它能过 L2 而 09 不能，说明第 1 轮失败的主因是风格暴露而不是假设本身。"
