name: b_r2_s4_10_streak_down_indpb
type: rule
desc: 现象是连续3日下跌会自我强化，融资盘平仓、程序化止损、散户恐慌在下跌日集中释放，第4日之后抛压反而衰减，若同时是同业PB最便宜的一端，下跌更可能是被动卖出而非基本面变化；A股涨跌停与T+1放大了短期连跌的过度反应，修复常在1到2周内完成，且连跌天数可直接观测、不依赖财务数据。做法是连续下跌达到3日、60日均换手低于5%触发买入，按行业内PB分位升序取10只，连续上涨3日（修复完成）或持满10日、亏5%离场，同行业最多3只。相对第1轮改动：第1轮B路完全没有用过streak类零件，全部用波动与换手水平，这份把“跌的天数”而非“跌的幅度”当成过度反应的度量。
buy:
- {op: streak_down, dir: above, threshold: 3}
- {op: turn_ma_n, n: 60, dir: below, threshold: 5}
rank: {op: ind_rank, of: {op: pb}, order: asc}
sell:
- {op: streak_up, dir: above, threshold: 3}
max_hold_days: 10
stop_loss: 5
max_positions: 10
industry_cap: 3
