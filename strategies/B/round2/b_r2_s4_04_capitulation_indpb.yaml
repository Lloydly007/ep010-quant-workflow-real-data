name: b_r2_s4_04_capitulation_indpb
type: rule
desc: 现象是60日溃疡指数高于8%说明持有人在过去一季被反复折磨、恐慌盘已出清，若它同时是同业PB分位最便宜的一端，折价就不是基本面恶化而是被一起砸；A股高换手均值回归，路径伤害到极端时短期反弹概率上升，行业内比价保证买到的是同业最被抛弃的一只、赔率最高。做法是60日溃疡高于8%触发买入，按行业内PB分位升序取10只，20日溃疡回落到3%以下（路径修复、折价收完）或持满40日、亏8%离场，不设行业上限。相对第1轮改动：第1轮同类条件用绝对PS排序且全市场选，买到的常是整个便宜行业一起砸，这里换成行业内PB分位、只买同业里最惨的。
buy:
- {op: ulcer_n, n: 60, dir: above, threshold: 8}
rank: {op: ind_rank, of: {op: pb}, order: asc}
sell:
- {op: ulcer_n, n: 20, dir: below, threshold: 3}
max_hold_days: 40
stop_loss: 8
max_positions: 10
industry_cap: 0
