name: b_r2_s4_12_attention_revival_indpb
type: rule
desc: 现象是20日均换手从冷门区升到3%以上、而行业内相对PB分位仍在自身120日低位，说明资金刚开始重新覆盖、折价还没修复完，而换手已经很高还在扩大的相对折价才是价值陷阱；A股的折价收敛由关注度驱动（卖方覆盖、游资试盘、指数纳入），关注度是先行指标、估值是滞后指标，两者错位时胜率最高。做法是20日均换手高于3%、60日均换手低于8%（排除已炒作）触发买入，按“行业内PB分位的120日时序分位”升序取10只，20日均换手破10%（投机化）或持满20日、亏8%离场，同行业最多3只。相对第1轮改动：第1轮把换手当静态水平（低于X就买），这份把换手的变化方向与相对折价的新鲜度配对，是第1轮没有的信号组合。
buy:
- {op: turn_ma_n, n: 20, dir: above, threshold: 3}
- {op: turn_ma_n, n: 60, dir: below, threshold: 8}
rank: {op: ts_pct, n: 120, of: {op: ind_rank, of: {op: pb}}, order: asc}
sell:
- {op: turn_ma_n, n: 20, dir: above, threshold: 10}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 3
