name: b_r2_s2_04_quarter_shrink_coil
type: rule
desc: "现象：近一季市值明显缩水（60 日市值时序分位最低）同时 60 日 ATR/收盘被压到 2% 以下（分布最窄的一成），是筹码沉淀、多空都不动手的“变盘前沉默”。为什么在 A 股该有超额：题材切换前普遍先量价收缩后放大，收缩期买入成本远低于启动后追高，而第 1 轮已证明追涨类系统性买在高点；这里赚的是波动压缩后的均值回复。怎么进出：ATR(60)/收盘 <2% 过滤，按 60 日市值时序分位升序取前 10；ATR(20) 放大到 5% 以上（变盘已发生）卖出；最长 40 日，8% 止损。相对第 1 轮失败模式改了什么：第 1 轮把低波当“防御”只求少亏，低波条件与绝对市值排序串行、互相消耗候选；本组把低波当“买点”，退出改为短窗波动扩张事件而不是同窗口阈值回摆；与 03 的分工是窗口所对应的假设不同（03 赌“一年缩水的修复”，04 赌“一季压缩后的变盘”），两者同时入选或同时失效即可判定到底是窗口敏感还是假设本身。"
buy:
- op: atr_close_n
  n: 60
  dir: below
  threshold: 2
rank:
  op: ts_pct
  n: 60
  of:
    op: size_ln
  order: asc
sell:
- op: atr_close_n
  n: 20
  dir: above
  threshold: 5
max_hold_days: 40
stop_loss: 8%
max_positions: 10
industry_cap: 0
