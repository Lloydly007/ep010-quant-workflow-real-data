name: b_r2_s2_20_abs_baseline_control
type: rule
desc: "现象：第 1 轮“小市值+低换手”用的就是绝对市值排序（rank: size_ln asc）与绝对换手阈值；如果本轮分位写法更好，差异必须能被单独测出来，否则无法区分“写法改进”与“运气”。为什么值得占一个名额：L2 只判搜索期扣成本超额 >0，无法归因；有对照组才能说清第 2 轮到底改对了什么。怎么进出：20 日均换手 <1% 过滤，按绝对流通市值（size_ln）升序取最小 10 只（第 1 轮口径）；单日换手 >8% 卖出；最长 40 日，10% 止损，不设行业上限。相对第 1 轮失败模式改了什么：与第 1 轮 s2_08（20 日均换手 <1% + 绝对市值升序）买的是同一批票，只把卖出从“20 日均换手回到 3%”换成“单日换手 8%”、持有上限 20→40 日；因此它与 01 的差值，就是“市值分位口径 + 60 日结构性冷门”相对“绝对市值 + 20 日冷门”的净贡献。"
buy:
- op: turn_ma_n
  n: 20
  dir: below
  threshold: 1
rank:
  op: size_ln
  order: asc
sell:
- op: turn
  dir: above
  threshold: 8
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 0
