name: a_r1_s5_02_breakout_vol
type: rule
desc: 收盘创60日新高且量比放大到20日均量的1.5倍以上，放量突破说明新高背后有新资金确认而非无量假突破，故突破当日买入、收盘回落到20日均线下方离场
buy:
- {op: break_high_n, n: 60, dir: above, threshold: 0.5}
- {op: vol_ratio_n, n: 20, dir: above, threshold: 1.5}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 20, order: desc}
max_hold_days: 20
stop_loss: 10%
max_positions: 10
industry_cap: 0
