name: a_r1_s4_17_tspct_mom
type: rule
desc: 同样是60日动量为正，用该股动量在自身最近20日中的时序分位来排序，等于优先买动量正在创出自身新高的股票——动量的时序位置比绝对涨幅更能刻画趋势的即时强度，故以此为排序键选前10，跌破20日线离场，20日为限、8%止损。
buy:
  - {op: ret_n, n: 60, dir: above, threshold: 5}
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
sell:
  - {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ts_pct, n: 20, of: {op: ret_n, n: 60}, order: desc}
max_hold_days: 20
stop_loss: 8
max_positions: 10
industry_cap: 0
