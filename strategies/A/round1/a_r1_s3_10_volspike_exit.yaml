name: a_r1_s3_10_volspike_exit
type: rule
desc: 上涨中5日量比放大到2倍以上是情绪过热的标志，这类日子往往对应换手耗尽与短期顶部，所以买入只要求1.2倍以上的温和放量、一旦出现2倍以上的异常放量立即离场；这套“进得温和、出得果断”的不对称规则把超额押在量能反转而不是量能追涨上，20日持有、5%止损。
buy:
  - {op: vol_ratio_n, n: 5, dir: above, threshold: 1.2}
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
sell:
  - {op: vol_ratio_n, n: 5, dir: above, threshold: 2.0}
rank: {op: vol_ratio_n, n: 20, order: desc}
max_hold_days: 20
stop_loss: 5%
max_positions: 10
industry_cap: 5
