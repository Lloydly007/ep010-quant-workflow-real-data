name: a_r1_s5_12_intraday_exit
type: rule
desc: 60日涨幅超10%且仍在放量的中期强势股，一旦出现收盘落在当日振幅下沿一半以下、同时5日累计跌超3%，说明本轮上涨的买盘先于均线破位就已衰竭，故用这个更早的退出信号省下从破位到均线确认的那段回撤，20日为兜底上限
buy:
- {op: ret_n, n: 60, dir: above, threshold: 10}
- {op: vol_ratio_n, n: 5, dir: above, threshold: 1.0}
sell:
- {op: close_pos_range, dir: below, threshold: 0.5}
- {op: ret_n, n: 5, dir: below, threshold: -3}
rank: {op: ret_n, n: 60, order: desc}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
