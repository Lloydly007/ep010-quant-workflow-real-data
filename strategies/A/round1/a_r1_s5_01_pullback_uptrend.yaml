name: a_r1_s5_01_pullback_uptrend
type: rule
desc: 已站上120日均线的中期上升趋势中出现5日累计跌超5%的“牛回头”，趋势型资金把急跌当成加仓窗口、抛压一次性释放后修复快，故在回调日买入、收盘跌破20日均线视为趋势终结离场
buy:
- {op: close_over_ma_n, n: 120, dir: above, threshold: 1.0}
- {op: ret_n, n: 5, dir: below, threshold: -5}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 120, order: desc}
max_hold_days: 10
stop_loss: 8%
max_positions: 10
industry_cap: 0
