name: a_r1_s4_13_streakup
type: rule
desc: 连续上涨超过3个交易日，是资金分多日、分批建仓留下的轨迹而非单日冲动，趋势启动初期的连阳具有延续惯性——故买连阳且收盘站上20日线，按连涨天数排序取最连贯者，价跌回5日线即判定连阳动能中断离场，10日为限、8%止损。
buy:
  - {op: streak_up, dir: above, threshold: 3}
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
sell:
  - {op: close_over_ma_n, n: 5, dir: below, threshold: 1.0}
rank: {op: streak_up, order: desc}
max_hold_days: 10
stop_loss: 8
max_positions: 10
industry_cap: 0
