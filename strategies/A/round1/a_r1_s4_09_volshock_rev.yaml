name: a_r1_s4_09_volshock_rev
type: rule
desc: 3日跌超8%同时量比放大到2倍的急跌，是流动性冲击或恐慌抛售的典型形态，情绪一次性出清后短期均值回归的赔率显著优于继续追跌——故买放量急跌且跌得最深者优先，反弹满5%即获利离场，最多持5日、5%止损兜住趋势性下跌。
buy:
  - {op: ret_n, n: 3, dir: below, threshold: -8}
  - {op: vol_ratio_n, n: 5, dir: above, threshold: 2.0}
sell:
  - {op: ret_n, n: 5, dir: above, threshold: 5}
rank: {op: ret_n, n: 3, order: asc}
max_hold_days: 5
stop_loss: 5
max_positions: 10
industry_cap: 0
