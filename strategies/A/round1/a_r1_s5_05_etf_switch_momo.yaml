name: a_r1_s5_05_etf_switch_momo
type: rule
desc: 只在沪深300ETF站上120日均线（宽基上行）时买入60日涨幅超10%的个股，因为中期动量在指数上行期延续、在指数下行期反转为超跌反弹，故用ETF做市场开关、个股跌破20日均线即离场
buy:
- {op: etf_above_ma_n, n: 120, dir: above, threshold: 0.5}
- {op: ret_n, n: 60, dir: above, threshold: 10}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 60, order: desc}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 0
