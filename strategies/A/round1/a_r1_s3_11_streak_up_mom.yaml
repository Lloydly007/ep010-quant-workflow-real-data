name: a_r1_s3_11_streak_up_mom
type: rule
desc: 连阳本身只是价格的轨迹，真正说明“资金在多日里分批建仓”的是连阳伴随的量能放大——所以这里要求连续4天以上上涨、当日5日量比超过1.2倍且收盘站稳20日线，把缩量小反弹从连阳样本里剔掉；一旦出现收盘价落在日内下半区（收盘位置低于0.5）的转弱信号即离场，5日持有、5%止损。
buy:
  - {op: streak_up, dir: above, threshold: 3}
  - {op: vol_ratio_n, n: 5, dir: above, threshold: 1.2}
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
sell:
  - {op: close_pos_range, dir: below, threshold: 0.5}
rank: {op: streak_up, order: desc}
max_hold_days: 5
stop_loss: 5%
max_positions: 10
industry_cap: 5
