name: a_r1_s3_09_volband_moderate
type: rule
desc: 5日量比落在1.2到2.0倍之间、收盘站在20日线上方、且5日涨幅超过2%的股票属于“适度放量上行”，放量代表关注度提升但不至于过热，这个量能带的收益好于两边——缩量上行没人接力、极端放量往往是情绪顶；用上下两条阈值夹住量能带，跌破20日线离场，20日持有、8%止损。
buy:
  - {op: vol_ratio_n, n: 5, dir: above, threshold: 1.2}
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 2.0}
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
  - {op: ret_n, n: 5, dir: above, threshold: 2}
sell:
  - {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 5, order: desc}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
