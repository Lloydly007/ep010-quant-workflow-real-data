name: a_r1_s5_14_dual_ma_trend
type: rule
desc: 收盘同时站上20日与60日均线且20日涨幅超3%，短中期多周期同向的趋势信号假突破率低、持续性长，适合更长的持有期来摊薄交易成本，故双均线共振时买入、持有60日或跌破20日均线离场
buy:
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.2}
- {op: ret_n, n: 20, dir: above, threshold: 3}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 20, order: desc}
max_hold_days: 60
stop_loss: 10%
max_positions: 10
industry_cap: 0
