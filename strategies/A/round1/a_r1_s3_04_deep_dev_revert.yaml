name: a_r1_s3_04_deep_dev_revert
type: rule
desc: 收盘仍在250日线下方且60日跌幅超过15%的深跌股，价格严重偏离长期持仓成本，均值回归的赔率高于趋势延续；以当日收在日内上半区（收盘位置高于0.5）作为止跌确认再买，反弹回到20日线上方即视为回归完成离场，20日持有、10%止损。
buy:
  - {op: close_over_ma_n, n: 250, dir: below, threshold: 1.0}
  - {op: ret_n, n: 60, dir: below, threshold: -15}
  - {op: close_pos_range, dir: above, threshold: 0.5}
sell:
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: ret_n, n: 60, order: asc}
max_hold_days: 20
stop_loss: 10%
max_positions: 10
industry_cap: 3
