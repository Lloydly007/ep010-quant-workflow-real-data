name: a_r1_s3_06_nearhigh_dryvol
type: rule
desc: 收盘已逼近60日高点5%以内、同时20日量比降到0.8倍以下的股票，说明上方抛压枯竭、筹码锁定良好，是突破前的低风险埋伏位；一旦整理失败、跌出高点10%以上即认输，20日持有、5%紧止损。
buy:
  - {op: dist_high_n, n: 60, dir: above, threshold: -5}
  - {op: vol_ratio_n, n: 20, dir: below, threshold: 0.8}
sell:
  - {op: dist_high_n, n: 60, dir: below, threshold: -10}
rank: {op: dist_high_n, n: 60, order: desc}
max_hold_days: 20
stop_loss: 5%
max_positions: 10
industry_cap: 5
