name: a_r1_s3_02_ma_pullback_dry
type: rule
desc: 中期趋势（60日线）向上的股票短期回踩到20日线下方但未破位（仍在0.8倍均线之上）且回踩阶段缩量（5日量比低于1.0），缩量说明抛压衰竭而不是资金撤离，回调结束后的反弹概率高于放量下跌；只有跌破60日线（中期趋势失效）才离场，20日持有、8%止损。
buy:
  - {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
  - {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 0.8}
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 1.0}
sell:
  - {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
rank: {op: vol_ratio_n, n: 5, order: asc}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 3
