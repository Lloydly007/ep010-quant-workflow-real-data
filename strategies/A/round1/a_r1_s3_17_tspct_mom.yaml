name: a_r1_s3_17_tspct_mom
type: rule
desc: 只有在年线（250日线）之上、长期趋势成立时，个股的动量强度才值得比较——而绝对动量高低会被个股自身波动水平淹没，改用“该股过去250个交易日里20日动量的时序分位”排序，挑出相对自身历史最强的那几只，同一只股票在自己最强状态下的延续概率最高；跌破60日线离场，20日持有、8%止损。
buy:
  - {op: close_over_ma_n, n: 250, dir: above, threshold: 1.0}
  - {op: ret_n, n: 60, dir: above, threshold: 8}
sell:
  - {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
rank: {op: ts_pct, n: 250, of: {op: ret_n, n: 20}, order: desc}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
