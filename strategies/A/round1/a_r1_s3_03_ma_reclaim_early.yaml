name: a_r1_s3_03_ma_reclaim_early
type: rule
desc: 已站上20日线、但60日线仍在头顶（收盘/MA60低于1.0）且20日涨幅已超5%的股票处于底部转强初期，均线压制与资金回补同时存在，这一阶段的超额来自“破位后回补”而不是趋势延续；收盘跌回20日线的0.8倍即止损，40日持有给足修复时间。
buy:
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
  - {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
  - {op: ret_n, n: 20, dir: above, threshold: 5}
sell:
  - {op: close_over_ma_n, n: 20, dir: below, threshold: 0.8}
rank: {op: ret_n, n: 20, order: desc}
max_hold_days: 40
stop_loss: 8%
max_positions: 10
industry_cap: 5
