name: a_r1_s4_18_indrank_mom
type: rule
desc: 把动量排序从全局换成行业内排名，剔除行业贝塔后剩下的行业内相对强势才是可复制的个股alpha，同时避免整组合押在单一行业上——故买60日动量靠前且站上60日线的股票并按行业内动量分位取前10，行业上限3只，跌破60日线离场，40日、10%止损。
buy:
  - {op: ret_n, n: 60, dir: above, threshold: 3}
  - {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
sell:
  - {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
rank: {op: ind_rank, of: {op: ret_n, n: 60}, order: desc}
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 3
