name: a_r1_s3_14_etf60_gate
type: rule
desc: 个股20日涨幅超过5%且站上20日线只是动量条件，真正的超额来自“市场状态与个股动量的交互”——只有300ETF站在60日线上方时，个股动量才容易被增量资金接力；ETF跌破60日线时即便个股信号仍在也不开仓，个股跌破20日线离场，10日持有、8%止损。
buy:
  - {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
  - {op: ret_n, n: 20, dir: above, threshold: 5}
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
sell:
  - {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 20, order: desc}
max_hold_days: 10
stop_loss: 8%
max_positions: 10
industry_cap: 5
