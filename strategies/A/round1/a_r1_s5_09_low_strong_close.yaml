name: a_r1_s5_09_low_strong_close
type: rule
desc: 股价距20日低点不足2%却收在当日振幅上沿80%以上，低位区的强收盘（长下影被吃掉）表明当日抛压已被吸收，次日承接资金延续的概率高，故当日买入、收盘转弱到振幅下沿即离场
buy:
- {op: dist_low_n, n: 20, dir: below, threshold: 2}
- {op: close_pos_range, dir: above, threshold: 0.8}
sell:
- {op: close_pos_range, dir: below, threshold: 0.5}
rank: {op: vol_ratio_n, n: 5, order: desc}
max_hold_days: 3
stop_loss: 5%
max_positions: 10
industry_cap: 0
