name: a_r1_s4_01_break20_vol
type: rule
desc: 个股创20日新高且成交量达到前5日均量1.5倍以上时，是资金真实推动的突破而非缩量假突破，突破后趋势延续的概率显著更高——故以突破+放量双重确认买入，信号过多时按5日涨幅取前10，跌破20日线或持满10日离场，8%硬止损。
buy:
  - {op: break_high_n, n: 20, dir: above, threshold: 0.5}
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
  - {op: vol_ratio_n, n: 5, dir: above, threshold: 1.5}
sell:
  - {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 5, order: desc}
max_hold_days: 10
stop_loss: 8
max_positions: 10
industry_cap: 0
