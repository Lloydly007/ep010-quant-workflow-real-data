name: a_r1_s4_12_closepos_weak
type: rule
desc: 长期趋势向上且5日动量为正的股票当日却收在日内下半区（0.5以下），多半是情绪性或流动性扰动造成的错杀，趋势未破时这种日内弱势只是更便宜的入场价——故买趋势股日内弱势并按60日动量取最强者，跌破20日线离场，10日为限、8%止损。
buy:
  - {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
  - {op: close_pos_range, dir: below, threshold: 0.5}
  - {op: ret_n, n: 5, dir: above, threshold: 3}
sell:
  - {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 60, order: desc}
max_hold_days: 10
stop_loss: 8
max_positions: 10
industry_cap: 0
