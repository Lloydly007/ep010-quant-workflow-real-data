name: a_r1_s5_18_xsec_short_momo
type: rule
desc: 5日涨幅超2%且量比高于1倍，极短周期上价格与量能同时转强说明追涨资金仍在流入，横截面上取20日动量分位靠前者可在数日内延续，故只持有3个交易日、5日跌超3%立即止损，并用行业上限防止同板块集中
buy:
- {op: ret_n, n: 5, dir: above, threshold: 2}
- {op: vol_ratio_n, n: 5, dir: above, threshold: 1.0}
sell:
- {op: ret_n, n: 5, dir: below, threshold: -3}
rank: {op: xsec_pct, of: {op: ret_n, n: 20}, order: desc}
max_hold_days: 3
stop_loss: 5%
max_positions: 10
industry_cap: 3
