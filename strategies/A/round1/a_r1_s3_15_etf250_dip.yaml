name: a_r1_s3_15_etf250_dip
type: rule
desc: 300ETF站上250日线（长期牛市状态）时回调才值得买——此时买入的是上升趋势里的20日线回踩（收盘跌到20日线下方而60日线仍向上），长牛环境里回调浅、修复快，牛市中最不该做的是追高；长牛状态结束或个股跌破60日线即离场，20日持有、10%止损。
buy:
  - {op: etf_above_ma_n, n: 250, dir: above, threshold: 0.5}
  - {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
  - {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
sell:
  - {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 60, order: desc}
max_hold_days: 20
stop_loss: 10%
max_positions: 10
industry_cap: 3
