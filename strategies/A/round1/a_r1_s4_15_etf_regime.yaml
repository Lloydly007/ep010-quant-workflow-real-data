name: a_r1_s4_15_etf_regime
type: rule
desc: 300ETF站上250日线代表长期牛市状态，此时中期动量才具备延续性，熊市里做同样动量容易撞上动量崩溃——故用ETF作市场开关只在长期均线上方做60日动量且动量最强者优先，20日回撤超10%判定趋势破坏离场，最长40日、10%止损，行业上限5只。
buy:
  - {op: etf_above_ma_n, n: 250, dir: above, threshold: 0.5}
  - {op: ret_n, n: 60, dir: above, threshold: 10}
  - {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
sell:
  - {op: ret_n, n: 20, dir: below, threshold: -10}
rank: {op: ret_n, n: 60, order: desc}
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 5
