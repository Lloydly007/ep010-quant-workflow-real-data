name: a_r1_s5_16_ind_rank_momo
type: rule
desc: 120日涨幅为正且站上20日均线的个股中，优先买同行业组内相对涨幅排名最靠前的，行业内部相对强度已扣除行业整体涨跌、更接近个股自身资金流入，故按季度级节奏持有40日、跌破20日均线离场并限制同行业最多3只
buy:
- {op: ret_n, n: 120, dir: above, threshold: 5}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ind_rank, of: {op: ret_n, n: 120}, order: desc}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 3
