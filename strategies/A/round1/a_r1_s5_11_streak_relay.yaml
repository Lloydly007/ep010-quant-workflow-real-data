name: a_r1_s5_11_streak_relay
type: rule
desc: 连涨4日以上且收盘价高出20日均线20%，连续上涨带来的赚钱效应会吸引跟随资金形成短期接力，但一旦出现4日连跌说明动能已转负，故连涨确认后买入、连跌4日即离场并用行业上限压住同板块扎堆
buy:
- {op: streak_up, dir: above, threshold: 3}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.2}
sell:
- {op: streak_down, dir: above, threshold: 3}
rank: {op: close_over_ma_n, n: 20, order: desc}
max_hold_days: 10
stop_loss: 5%
max_positions: 10
industry_cap: 5
