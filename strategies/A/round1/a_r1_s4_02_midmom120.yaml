name: a_r1_s4_02_midmom120
type: rule
desc: 过去120日累计涨幅超15%且收盘站稳60日线的股票，反映的是机构在低换手下缓慢调仓形成的中期动量，这种慢变量不会像日内信号那样被套利迅速抹平——故买中期赢家并按60日动量排序，跌破60日线离场，最长持有40日、10%止损，同时用行业上限5只避免押在单一行业。
buy:
  - {op: ret_n, n: 120, dir: above, threshold: 15}
  - {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
sell:
  - {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 60, order: desc}
max_hold_days: 40
stop_loss: 10
max_positions: 10
industry_cap: 5
