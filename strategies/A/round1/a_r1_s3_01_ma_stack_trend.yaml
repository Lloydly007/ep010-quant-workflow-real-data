name: a_r1_s3_01_ma_stack_trend
type: rule
desc: 收盘同时站上20日与60日均线（短中期趋势共振）说明新增资金已覆盖前期套牢盘、趋势具备惯性，这类股票的后续收益高于均线纠缠的股票；收盘跌破20日线即认定共振破坏离场，40日持有、10%止损。
buy:
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
  - {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
sell:
  - {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 60, order: desc}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 0
