name: a_r1_s3_07_low20_support
type: rule
desc: 长期趋势向上（站上120日线）的股票回踩到20日低点2%以内，是强势股在近期支撑位被重新定价的位置，支撑有效的反弹胜率高于趋势中段追高；反弹到5日涨幅8%即获利了结，10日持有、5%止损（支撑破位必须快走）。
buy:
  - {op: dist_low_n, n: 20, dir: below, threshold: 2}
  - {op: close_over_ma_n, n: 120, dir: above, threshold: 1.0}
sell:
  - {op: ret_n, n: 5, dir: above, threshold: 8}
rank: {op: ret_n, n: 120, order: desc}
max_hold_days: 10
stop_loss: 5%
max_positions: 10
industry_cap: 3
