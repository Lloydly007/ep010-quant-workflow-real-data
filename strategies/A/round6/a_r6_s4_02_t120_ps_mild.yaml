desc: "底座对照：把第 5 轮入围席的结构（ps 半权 + 半年低换手）当骨架，只沿规模与换手两个轴向两端拉，极端档把 size 压到 −2.5、turn 加到 −1.0，温和档退到 size −0.8、turn −0.3，估值腿恒为 ps −0.5。问的是那一席的成绩里有多少来自「极小微盘 + 极端冷门」的风格暴露、有多少来自营收倍数选股本身：温和档若不塌，说明估值腿独立成立；若只有极端档能拿分，那入围席本质是风格押注。本份为第 1 对的温和档：size_ln −0.80、turn_ma_n(120) −0.30。按 |w| 归一：size_ln 50.0% / turn_ma_n(120) 18.8% / ps_ttm 31.2%。同对的另一份只改规模与换手两个档位，其余腿与窗口完全一致，因此两份之差就是「风格暴露强度」的边际贡献。持仓 30、每周首个交易日调仓、按行业内秩中性化。"
