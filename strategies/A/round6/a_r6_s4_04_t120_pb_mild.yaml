desc: "与 01/02 同骨架，但估值腿换成 pb（净资产口径、全正、无 pe 的负值陷阱），检验「资产便宜」与「营收便宜」在极端规模与极端冷门档下是否可互换。pb 对有形资产与壳价值更敏感，理论上更能压住极端小盘里的资产泡沫；若 pb 版在激进档明显更稳，说明极端小盘必须配资产端下限，而不是营收端。本份为第 2 对的温和档：size_ln −0.80、turn_ma_n(120) −0.30。按 |w| 归一：size_ln 50.0% / turn_ma_n(120) 18.8% / pb 31.2%。同对的另一份只改规模与换手两个档位，其余腿与窗口完全一致，因此两份之差就是「风格暴露强度」的边际贡献。持仓 30、每周首个交易日调仓、按行业内秩中性化。"
