name: a_r6_s4_32_t120_xsecps_mild
type: score
desc: "估值腿走截面分位包装（xsec_pct of ps_ttm）而不是原始 ps：口径从「倍数越低越好」变成「在当日池内的相对便宜程度」，对小盘股 ps 水平差异更稳健、能削弱极端值主导。激进档检验极端规模下分位口径是否减少名单的风格漂移；温和档检验分位腿份额上升后是否优于原始腿（对比 01/02），即分位化本身值不值一个因子的位置。本份为第 16 对的温和档：size_ln −0.80、turn_ma_n(120) −0.30。按 |w| 归一：size_ln 50.0% / turn_ma_n(120) 18.8% / xsec_pct(ps_ttm) 31.2%。同对的另一份只改规模与换手两个档位，其余腿与窗口完全一致，因此两份之差就是「风格暴露强度」的边际贡献。持仓 30、每周首个交易日调仓、按行业内秩中性化。"
