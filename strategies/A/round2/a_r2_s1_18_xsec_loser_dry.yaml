name: a_r2_s1_18_xsec_loser_dry
type: rule
desc: 现象：20日跌超10%、贴250日低点15%以内、5日量比低于0.8；但排序键不是绝对跌幅，而是「60日涨幅的当日横截面分位」由低到高。为什么A股该有超额：绝对跌幅最大的股票往往是基本面恶化、退市风险或财务造假的公司（A股这类样本在2018与2022年极多），用横截面相对跌幅排序，能把「全市场都在跌」和「个股被单独抛弃」区分开，实际买到的是相对受损最重、但仍处在正常分布里的一批，从结构上避开第1轮「越跌越买、越买越跌」的选股偏差。怎么进出：三条同时成立才买，rank用xsec_pct(ret_n60)升序（当日截面最弱者先买），回到60日高点2%以内离场、20日上限、10%止损、不设行业上限（排序键本身已含截面信息）。相对第1轮失败模式：第1轮超跌组清一色用ret_n asc／dist_low asc这类绝对量排序（a_r1_s2_04/a_r1_s1_06），等于按「最惨」选股；本份把排序键换成相对分位、把选股域从「最惨」改成「相对错杀」，这是选股逻辑的改动，不是阈值微调。
buy:
  - {op: ret_n, n: 20, dir: below, threshold: -10.0}
  - {op: dist_low_n, n: 250, dir: below, threshold: 15.0}
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 0.8}
rank: {op: xsec_pct, of: {op: ret_n, n: 60}, order: asc}
sell:
  - {op: dist_high_n, n: 60, dir: above, threshold: -2.0}
max_hold_days: 20
stop_loss: 10%
industry_cap: 0
