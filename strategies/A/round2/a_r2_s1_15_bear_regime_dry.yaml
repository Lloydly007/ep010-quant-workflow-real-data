name: a_r2_s1_15_bear_regime_dry
type: rule
desc: 现象：沪深300ETF在250日线下方（市场处于熊市结构），个股60日跌超15%、20日均换手低于2%、5日量比低于0.8——熊市里最深、最冷、最没人要的股票。为什么A股该有超额：熊市中段的深跌＋地量是「最后投降」的特征，此时卖方已经出清、情绪极差；A股熊市末端的反弹多由政策与流动性驱动，超跌＋地量的品种弹性最大。这是对第1轮市场开关用法的反向利用：第1轮把ETF破位当清仓信号，本份把ETF破位当赔率最高的买入环境。怎么进出：四条同时成立才买，rank按60日跌幅最深优先，收盘重回60日线上方（趋势修复确认）离场、60日上限、不设止损。相对第1轮失败模式：第1轮A路在etf_above_ma_n250 below 0.5 时只写卖出或清仓（a_r1_s2_12），等于把熊市整段让给现金，而A路最大亏损恰恰来自熊市里无条件满仓超跌股；本份反过来只在熊市买「跌无可跌」的地量股，用60日长持有换赔率，并且必须同时满足深跌＋地量＋低换手，不去接还在放量下跌的刀。
buy:
  - {op: etf_above_ma_n, n: 250, dir: below, threshold: 0.5}
  - {op: ret_n, n: 60, dir: below, threshold: -15.0}
  - {op: turn_ma_n, n: 20, dir: below, threshold: 2.0}
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 0.8}
rank: {op: ret_n, n: 60, order: asc}
sell:
  - {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
max_hold_days: 60
stop_loss: 无
industry_cap: 10
