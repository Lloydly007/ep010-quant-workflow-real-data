name: a_r2_s2_11_gate_resonance_short
type: rule
desc: 现象：第1轮多数配置持有10到60日，但A股趋势的持续期很短，浮盈常在持有期内被均值回归吃回，换手成本也高。为何A股有超额：当指数当日收强且个股当日收在日内高位（收盘位置高于振幅八成）时，次日到第三日的惯性最强；只吃这段“共振余温”、用日内转弱作为离场，比长期持有更贴合A股短周期特征。进出：ETF20日线上方、个股收盘位置高于0.8、3日涨幅超3%时买入，按3日涨幅降序优先；收盘位置跌破0.5即离场，最长5日、5%止损、同行业最多10只。相对第1轮改动：把持有期从10到60日压到3到5日并改用日内结构退出，改变第1轮“趋势拿不住、短打又不敢”的持有期错配。
buy:
- {op: etf_above_ma_n, n: 20, dir: above, threshold: 0.5}
- {op: close_pos_range, dir: above, threshold: 0.8}
- {op: ret_n, n: 3, dir: above, threshold: 3}
rank: {op: ret_n, n: 3, order: desc}
sell:
- {op: close_pos_range, dir: below, threshold: 0.5}
max_hold_days: 5
stop_loss: 5%
max_positions: 10
industry_cap: 10
