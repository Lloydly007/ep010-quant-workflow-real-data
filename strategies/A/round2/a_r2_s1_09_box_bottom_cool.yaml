name: a_r2_s1_09_box_bottom_cool
type: rule
desc: 现象：收盘同时距250日高点15%以内、距250日低点10%以内——两个距离约束合起来意味着一年高低点相距不足约30%（是箱体而非单边趋势），价格位于箱体下缘；同时20日均换手低于1%。为什么A股该有超额：箱体下沿是前期成交密集区，成本支撑真实存在；换手冷却说明箱体内的博弈盘已经离场，要继续向下突破必须有新的增量卖盘，而「一年高低点相距不足30%」本身就证明不存在趋势性卖压——这与单边下跌股的低点有本质区别。怎么进出：三条同时成立才买，rank按距250日低点最近优先，回到60日高点2%以内离场、20日上限、8%止损。相对第1轮失败模式：第1轮的低位组只判断「离低点多近」（a_r1_s1_06 用dist_low250<8），把单边下跌的半山腰和箱体下沿混为一谈，这是A路低位份全线亏损的结构性原因之一；本份改用「同时贴近年内高点与低点」把单边下跌股整段剔除，只买有区间支撑的箱体下缘，并用换手冷却二次确认卖压枯竭。
buy:
  - {op: dist_high_n, n: 250, dir: above, threshold: -15.0}
  - {op: dist_low_n, n: 250, dir: below, threshold: 10.0}
  - {op: turn_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: dist_low_n, n: 250, order: asc}
sell:
  - {op: dist_high_n, n: 60, dir: above, threshold: -2.0}
max_hold_days: 20
stop_loss: 8%
industry_cap: 5
