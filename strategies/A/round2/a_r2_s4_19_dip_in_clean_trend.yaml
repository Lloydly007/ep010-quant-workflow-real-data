name: a_r2_s4_19_dip_in_clean_trend
type: rule
desc: 现象：路径干净（120日溃疡指数低于8%，即损伤低于全池中位12.6%）的上升趋势（收盘价高于120日均线）中出现连续4个及以上下跌日时买入，短周期收益显著优于在同一批股票上追涨入场（该组合日均约7只候选，是刻意做得稀少的事件型形态）。为什么A股该有超额：A股投资者结构以短线资金为主，连续下跌会触发恐慌性抛售与融资盘被动减仓，造成与基本面相无关的短期折价；在长期路径无损的票上，这类折价恢复概率高，且买在下跌日能拿到比突破日更低的成本、更近的止损位，等于同时改善赔率与胜率。进出：买入需收盘价高于120日均线、120日溃疡指数低于8%、连续下跌天数大于3，按120日溃疡指数升序取前10；持有10日、止损8%，10日涨幅超过8%即止盈（短周期只赚折价修复段）。相对第1轮失败模式的改动：第1轮全部是上涨日入场（突破、连涨、创新高），本轮明确改成下跌日入场，直接对治"追涨买在高点"；路径质量用来回答"哪只股票的下跌只是噪音"。
buy:
- {op: close_over_ma_n, n: 120, dir: above, threshold: 1.0}
- {op: ulcer_n, n: 120, dir: below, threshold: 8}
- {op: streak_down, dir: above, threshold: 3}
rank: {op: ulcer_n, n: 120, order: asc}
sell:
- {op: ret_n, n: 10, dir: above, threshold: 8}
max_hold_days: 10
stop_loss: 8%
max_positions: 10
industry_cap: 0
