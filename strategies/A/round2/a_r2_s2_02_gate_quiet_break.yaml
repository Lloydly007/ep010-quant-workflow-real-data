name: a_r2_s2_02_gate_quiet_break
type: rule
desc: 现象：第1轮的突破条件普遍要求5日量比放大到1.5倍甚至2倍以上，但A股的放量突破日常常是获利盘借流动性派发，等权小盘池的承接盘更薄。为何A股有超额：创20日新高却不需要放量，说明上方抛压已被消化、筹码锁定，这类“安静的新高”只在指数上行期才容易被增量资金接力，成本也低于放量突破日。进出：ETF60日线上方、突破20日高点、5日量比低于1倍且站上20日线时买入，按20日量比由小到大优先；跌破20日线离场，最长20日、8%止损、同行业最多10只。相对第1轮改动：把“放量确认”反转为“缩量突破”，去掉第1轮最典型的追高换手环节。
buy:
- {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: vol_ratio_n, n: 5, dir: below, threshold: 1.0}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: vol_ratio_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 10
