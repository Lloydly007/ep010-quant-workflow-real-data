name: a_r2_s1_02_capitulation_dry
type: rule
desc: 现象：20个交易日跌超10%，但20日均换手已回落到2%以下、且当日收盘仍在日内振幅上半区——「跌得多、换手小、有人接」三者同时出现。为什么A股该有超额：A股T+1与跌停板把恐慌压缩在少数交易日，成交量放大往往发生在恐慌当天；等换手已经冷下来、盘口又收在上半区，说明恐慌盘被主动接走，后续是修复而不是续跌；低换手还意味着没有拥挤的博弈盘，反弹时抛压小。怎么进出：三条同时成立才买，rank用「量比相对自身60日区间的分位」（ts_pct60 of vol_ratio5）由低到高，即抛压最枯竭的先买；20日内反弹8%兑现，10%止损兜底。相对第1轮失败模式：第1轮A路最好的超跌份也只有-3.8%超额，a_r1_s2_04几乎同样条件（ret20<-10＋收盘在上半区）却用5日持有＋8%止损＋按跌幅最深排序，把赔率压进最短的窗口；本份加「20日均换手<2%」这条非拥挤确认，持有期拉到20日，排序从「跌幅最深」改为「量能最枯」。
buy:
  - {op: ret_n, n: 20, dir: below, threshold: -10.0}
  - {op: turn_ma_n, n: 20, dir: below, threshold: 2.0}
  - {op: close_pos_range, dir: above, threshold: 0.5}
rank: {op: ts_pct, n: 60, of: {op: vol_ratio_n, n: 5}, order: asc}
sell:
  - {op: ret_n, n: 20, dir: above, threshold: 8.0}
max_hold_days: 20
stop_loss: 10%
industry_cap: 10
