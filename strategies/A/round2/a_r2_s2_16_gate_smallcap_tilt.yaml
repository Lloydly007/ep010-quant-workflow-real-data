name: a_r2_s2_16_gate_smallcap_tilt
type: rule
desc: 现象：本轮真正的对手是等权全池买入持有的+15.11%/年，其超额主要来自小盘弹性；第1轮的排序键几乎全是动量降序，选出来的是最热门的（往往偏大市值）股票，连基准的β都拿不到。为何A股有超额：指数上行期做趋势，超额来自“趋势β加小盘弹性”两层，同一条趋势里优先流通市值最小的，才可能跑赢等权全池。进出：ETF60日线上方、站上60日线、60日涨幅超3%时买入，按流通市值对数由小到大优先；跌破60日线离场，最长40日、10%止损、同行业最多10只。相对第1轮改动：排序键从“动量最大”换成“市值最小”，正面回应第1轮超额中位-25.4%、连基准都跑不过的问题。
buy:
- {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
- {op: ret_n, n: 60, dir: above, threshold: 3}
rank: {op: size_ln, order: asc}
sell:
- {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 10
