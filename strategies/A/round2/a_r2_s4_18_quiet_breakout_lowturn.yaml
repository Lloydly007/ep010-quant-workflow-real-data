name: a_r2_s4_18_quiet_breakout_lowturn
type: rule
desc: 现象：距120日高点3%以内但20日均换手率低于1%的"无量新高"股票，后续强于放量新高（该组合日均约20只候选）。为什么A股该有超额：放量新高往往是筹码交换的高点，游资与散户在此接力，随后无人接盘即回落；无量新高说明没有派发、卖盘稀少，价格沿最小阻力方向移动。A股换手率与次周收益负相关，这一点在创新高股票内部同样成立，因为游资驱动的热门股换手必然放大。进出：买入需距120日高点不足3%、20日均换手率低于1%、60日溃疡指数低于5%，按20日均换手率升序取前10；持有20日、止损8%，跌离120日高点超过8%即卖出。相对第1轮失败模式的改动：第1轮把放量当成突破确认（量比大于1.5），本轮把低换手当成确认条件，是对同一量能维度的反向使用；本份是全组最明确的反向假设，若它也不能转正，说明"量能确认"这条路整体的符号就是错的。
buy:
- {op: dist_high_n, n: 120, dir: above, threshold: -3}
- {op: turn_ma_n, n: 20, dir: below, threshold: 1}
- {op: ulcer_n, n: 60, dir: below, threshold: 5}
rank: {op: turn_ma_n, n: 20, order: asc}
sell:
- {op: dist_high_n, n: 120, dir: below, threshold: -8}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 10
