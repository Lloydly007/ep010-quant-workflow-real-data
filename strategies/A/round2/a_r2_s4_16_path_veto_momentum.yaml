name: a_r2_s4_16_path_veto_momentum
type: rule
desc: 现象：保留强动量（120日涨幅大于10%）但对路径损伤零容忍（120日溃疡指数低于5%）后，剩下的候选日均约60只，是动量组里最干净的一小撮（无过滤时 ulcer120 低于5% 仅占全池6.3%）。为什么A股该有超额：第1轮动量的失败可能并非动量本身无效，而是动量选出的股票里混入大量深回撤、高换手的情绪票——涨停板与T+1制度让A股情绪票的价格路径呈现"大涨后深跌"，溃疡指数正好度量这一点；把路径受损的票否决掉，动量才回到"资金持续流入"的本义。进出：买入需120日涨幅大于10%、120日溃疡指数低于5%，按120日溃疡指数升序取最干净的10只；持有20日、止损8%，120日溃疡指数升破8%即卖出。相对第1轮失败模式的改动：入场信号与第1轮同族（动量），唯一新增的是路径损伤否决，属于严格对照实验，可以回答"动量错在选股还是错在方向"；本份与第15份（给涨幅设上限）互为竞争解释。
buy:
- {op: ret_n, n: 120, dir: above, threshold: 10}
- {op: ulcer_n, n: 120, dir: below, threshold: 5}
rank: {op: ulcer_n, n: 120, order: asc}
sell:
- {op: ulcer_n, n: 120, dir: above, threshold: 8}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
