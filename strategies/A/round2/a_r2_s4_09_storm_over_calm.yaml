name: a_r2_s4_09_storm_over_calm
type: rule
desc: 现象：120日溃疡指数高于8%（一年内有过明显回撤）但最近20日溃疡指数低于2%（近一个月几乎没有回撤）的股票，处在杀跌动能耗尽后的静默期（该组合日均约100只候选，是典型的路径修复形态）。为什么A股该有超额：A股下跌多由杠杆与情绪驱动，出清后往往出现长时间缩量横盘，此时卖压枯竭、推升所需资金最少；这类"两窗口溃疡指数背离"的信息与趋势类信号相关性低，能提供与第1轮完全不同的收益来源；而单纯抄底（买深跌）会在二次探底中被反复止损，本形态要求价格已经站回60日线，等于要求修复已开始。进出：买入需 ulcer120 高于8%、 ulcer20 低于2%、收盘价高于60日均线，按20日溃疡指数升序取最平静的10只；持有40日、止损10%，20日溃疡指数升破5%（静默被打破且是向下打破）即卖出。相对第1轮失败模式的改动：第1轮只在上涨形态（突破、新高、连涨）里找机会，从未使用"跌完之后"的信息；本轮以两个窗口溃疡指数的背离作为主信号，是A路里不追涨的逆向路径质量假设。
buy:
- {op: ulcer_n, n: 120, dir: above, threshold: 8}
- {op: ulcer_n, n: 20, dir: below, threshold: 2}
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
rank: {op: ulcer_n, n: 20, order: asc}
sell:
- {op: ulcer_n, n: 20, dir: above, threshold: 5}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 0
