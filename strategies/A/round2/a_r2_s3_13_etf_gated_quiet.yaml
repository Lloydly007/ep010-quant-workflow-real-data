name: a_r2_s3_13_etf_gated_quiet
type: rule
desc: "现象：假突破率随市场β变化——系统性下跌期突破的失败率极高，而第1轮突破组多数没有市场状态门槛，等于在下跌段里照买。为什么该有超额：沪深300ETF在60日线上方时市场整体流动性扩张，个股突破才有承接资金；再叠加20日均换手<3%的安静票，只在牛市里的冷门突破下注，避开情绪票与逆势买入。怎么进出：ETF站上60日线、20日新高、20日均换手<3%、站在20日线上方才买；跌破20日线离场、持满20日、-8%止损、行业最多5只、按120日涨幅降序。相对第1轮：把市场状态门槛与换手过滤同时加上，修掉第1轮在熊市里持续买入假突破所造成的回撤来源。"
buy:
- {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: turn_ma_n, n: 20, dir: below, threshold: 3}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: ret_n, n: 120, order: desc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 5
