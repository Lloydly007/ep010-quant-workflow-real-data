name: a_r2_s3_12_atr_squeeze_break
type: rule
desc: "现象：第1轮完全不看日内波幅，买到的常常是上下影线剧烈、波幅放大型的突破，这类突破多是假动作。为什么该有超额：突破前日内真实波幅压缩（ATR/收盘<3%）说明多空分歧收敛、筹码沉淀；压缩后的突破若当日收盘仍在振幅80%以上，说明压缩是被向上解决而不是又一次假动作。ATR口径含跳空，比收益标准差更贴近真实换手成本。怎么进出：20日新高、ATR/收盘<3%、收盘位置>0.8才买；跌破20日线离场、持满20日、-10%止损；按ATR升序取压缩最彻底的10只。相对第1轮：把波动压缩加强收盘作为真突破的必要条件，并首次用含跳空的ATR口径识别跳空型假突破。"
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: atr_close_n, n: 20, dir: below, threshold: 3}
- {op: close_pos_range, dir: above, threshold: 0.8}
rank: {op: atr_close_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 10%
max_positions: 10
industry_cap: 0
