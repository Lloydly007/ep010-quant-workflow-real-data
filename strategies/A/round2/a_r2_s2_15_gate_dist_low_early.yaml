name: a_r2_s2_15_gate_dist_low_early
type: rule
desc: 现象：第1轮的突破类信号多发生在个股已上涨一段之后，等于用高成本买趋势的后半段。为何A股有超额：距120日低点10%以内、同时站上20日线并保有20日正涨幅的股票，是趋势的第一波启动，上方没有近期套牢盘、赔率最好，指数上行期这类早期启动的持续性最强。进出：ETF60日线上方、距120日低点10%以内、站上20日线且20日涨幅超3%时买入，按20日涨幅最温和者优先；跌破20日线离场，最长20日、8%止损、同行业最多10只。相对第1轮改动：把入场位置从“趋势中后段”前移到“启动初期”，用距低点距离替代突破条件。
buy:
- {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
- {op: dist_low_n, n: 120, dir: below, threshold: 10}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
- {op: ret_n, n: 20, dir: above, threshold: 3}
rank: {op: ret_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 10
