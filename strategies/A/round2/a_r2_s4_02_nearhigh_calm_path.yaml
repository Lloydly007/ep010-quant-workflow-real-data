name: a_r2_s4_02_nearhigh_calm_path
type: rule
desc: 现象：距120日高点3%以内的股票里，近60日路径几乎无回撤（溃疡指数低于3%）的一小部分与其余新高股走势明显分化（该组合日均仅约21只候选）。为什么A股该有超额：创新高本身不提供信息，A股的高点常是题材接力与博弈资金交换筹码的位置，多数新高股随即回吐；只有一路小幅波动上台阶的新高才反映真实增量买盘，因为成本区在持续抬高、上方没有套牢盘压制。进出：买入需距120日高点不足3%且60日溃疡指数低于3%，按60日溃疡指数升序取前10；持有20日、止损8%，跌离120日高点超过10%即卖出（用回撤深度退出，不用均线）。相对第1轮失败模式的改动：第1轮把新高加放量当确认信号、并用涨幅排序，等于在加速段买入；本轮保留新高位置但给新高的资格加上路径损伤上限，排序键换成回撤损伤而不是涨幅。
buy:
- {op: dist_high_n, n: 120, dir: above, threshold: -3}
- {op: ulcer_n, n: 60, dir: below, threshold: 3}
rank: {op: ulcer_n, n: 60, order: asc}
sell:
- {op: dist_high_n, n: 120, dir: below, threshold: -10}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 10
