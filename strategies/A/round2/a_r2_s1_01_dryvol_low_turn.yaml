name: a_r2_s1_01_dryvol_low_turn
type: rule
desc: 现象：股价贴在250日低点10%以内、5日量比不足0.8、20日均换手已降到1%以下（供应商turnover_rate真值），即「地量＋低位＋无人关注」三件事同时发生——该卖的已经卖完、想买的还没进场。为什么A股该有超额：A股小盘股没有做市商，抛压只能靠散户与杠杆资金自然出清，出清完成后价格对少量增量资金极其敏感；而年内低点上方往往是前期密集成交留下的解套盘，反弹初段阻力反而小，等成交量恢复时价格已经离场。怎么进出：三条同时成立才买，按「距250日低点的时序分位」（ts_pct250 of dist_low250）取最贴底的10只，自低点反弹超过15%视为修复完成离场，20日上限、不设止损。相对第1轮失败模式：第1轮A路100份年化中位-17.9%、超额中位-25.4%、L2通过0份，其超跌组（a_r1_s2_04/a_r1_s3_12）统一5日持有＋8%止损＋按跌幅最深排序，等于在下跌中段接刀再被噪声止损；本份把「按跌幅排序」换成「按缩量＋贴底程度排序」，持有期由5日拉到20日，止损取消。
buy:
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 0.8}
  - {op: dist_low_n, n: 250, dir: below, threshold: 10.0}
  - {op: turn_ma_n, n: 20, dir: below, threshold: 1.0}
rank: {op: ts_pct, n: 250, of: {op: dist_low_n, n: 250}, order: asc}
sell:
  - {op: dist_low_n, n: 250, dir: above, threshold: 15.0}
max_hold_days: 20
stop_loss: 无
industry_cap: 5
