name: a_r2_s4_11_ts_calm_extreme
type: rule
desc: 现象：把今天的20日溃疡指数放进该股票自己过去120日的分布里看（时序分位），处在最低一档时，未来一段时间的收益风险比明显更好（全池 ulc20 中位4.2%，但同一数值在不同年份含义完全不同）。为什么A股该有超额：A股波动有强聚集性，平静期会延续；而绝对阈值随牛熊漂移（实测120日溃疡指数中位数2016年15.9、2017年9.8、2015年13.0），同一套固定参数在不同年份筛出的是完全不同风险等级的人群。用时序分位让每只股票与自己比，参数天然自适应，等于把"路径质量"从绝对水平换成相对水平。进出：买入需收盘价高于60日均线、20日溃疡指数低于3%，排序键用 ts_pct(120) 套 溃疡指数(20) 升序取最平静的10只；持有20日、止损8%，跌破60日均线即卖出。相对第1轮失败模式的改动：第1轮全部用固定绝对阈值（涨幅大于10%、回撤小于多少），在2015与2017两种波动环境里含义漂移；本轮的排序键是"相对自己最平静"，是时序加截面的双重归一化。
buy:
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
- {op: ulcer_n, n: 20, dir: below, threshold: 3}
rank: {op: ts_pct, n: 120, of: {op: ulcer_n, n: 20}, order: asc}
sell:
- {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
