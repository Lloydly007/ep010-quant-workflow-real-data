name: a_r2_s2_01_gate_pullback_high
type: rule
desc: 现象：第1轮追涨类买入都发生在突破或大涨的当日，而A股高换手个股在冲高日买入的平均成本最差，随后1到3日回踩概率高。为何A股有超额：沪深300ETF站上60日线说明增量资金在场，此时距年线高点不远的强势股回落只是换手而非趋势终结，在回调日而非冲高日进场，能把同一段趋势的成本压到低位。进出：ETF60日线上方、个股距250日高点8%以内、近5日回落超2%且仍站上60日线时买入，按5日跌幅最深者优先；跌破20日线离场，最长20日、8%止损、同行业最多5只。相对第1轮改动：把“追突破当日”改成“等回踩确认后再买”，直接针对第1轮买在高点的失败模式。
buy:
- {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
- {op: dist_high_n, n: 250, dir: above, threshold: -8}
- {op: ret_n, n: 5, dir: below, threshold: -2}
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
rank: {op: ret_n, n: 5, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 5
