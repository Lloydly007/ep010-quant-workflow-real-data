name: a_r2_s3_15_fastfail_hold3
type: rule
desc: "现象：假突破在次日几乎都表现为冲高回落加收盘弱，而第1轮持有10~20日才卖，等于把假突破扛成真亏损（回撤中位-89.5%）。为什么该有超额：引擎在信号日次日开盘成交，入场后第一根K线就是最快的证伪信号；收盘跌破5日线或持满3日就先走，把单笔亏损截断在2~3%，而不是等-8%止损或均线破位。A股高换手均值回归意味着短线兑现的胜率高于长持等待。怎么进出：20日新高、换手<8%、收盘上半区才买；跌破5日线或持满3日离场、-5%止损；按20日涨幅降序取最强的10只。相对第1轮：唯一把持有期压到3日、止损压到5%的配置，用高频证伪替代低频等待，检验亏损是否主要来自扛单。"
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: turn, dir: below, threshold: 8}
- {op: close_pos_range, dir: above, threshold: 0.5}
rank: {op: ret_n, n: 20, order: desc}
sell:
- {op: close_over_ma_n, n: 5, dir: below, threshold: 1.0}
max_hold_days: 3
stop_loss: 5%
max_positions: 10
industry_cap: 0
