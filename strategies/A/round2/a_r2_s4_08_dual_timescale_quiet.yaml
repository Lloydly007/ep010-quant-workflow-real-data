name: a_r2_s4_08_dual_timescale_quiet
type: rule
desc: 现象：60日ATR除以收盘低于3%且60日日收益标准差低于3%同时成立的股票，是真正意义上的低波动，而不是"暴跌后V形反弹"造成的假平滑（两个不同量纲同时低，日均约90只候选）。为什么A股该有超额：A股闪崩与业绩地雷在单一波动指标上会留下低波动的假象（大跌后横盘），用日内振幅与收益标准差交叉验证可以剔除；真正的低波动品种在等权小盘基准面前有稳定超额且回撤更浅，组合层面更容易拿住，减少被动换手。进出：买入需距120日低点高于10%（处在趋势中而不是下跌通道里的低波动）、ATR除以收盘(60)低于3%、收益波动(60)低于3%、120日溃疡指数低于8%，按60日ATR除以收盘升序取前10；持有40日、止损10%，60日收益波动升破5%即卖出。相对第1轮失败模式的改动：第1轮只看方向与突破，完全没有波动维度；本轮用两个量纲交叉的低波动作主条件，并用"距120日低点高于10%"排除把下跌通道里的低波动误当机会。
buy:
- {op: atr_close_n, n: 60, dir: below, threshold: 3}
- {op: vol_n, n: 60, dir: below, threshold: 3}
- {op: dist_low_n, n: 120, dir: above, threshold: 10}
- {op: ulcer_n, n: 120, dir: below, threshold: 8}
rank: {op: atr_close_n, n: 60, order: asc}
sell:
- {op: vol_n, n: 60, dir: above, threshold: 5}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 0
