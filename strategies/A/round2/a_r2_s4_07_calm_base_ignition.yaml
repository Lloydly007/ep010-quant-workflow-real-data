name: a_r2_s4_07_calm_base_ignition
type: rule
desc: 现象：120日路径干净（溃疡指数低于5%）的股票出现首次温和放量（5日量比大于1.2）而5日涨幅仍不足5%时，是资金试探而不是情绪加速（该组合日均约9只候选，是刻意做得很少的形态）。为什么A股该有超额：A股散户发现放量时通常价格已在加速中段，此时买入承担的是接力风险；把放量限定在"价格尚未启动且此前路径无损"的股票上，拿到的是启动初期成本，下方空间由路径质量决定；同一量能维度上换个位置使用，就避开了第1轮放量突破买在高点的问题。进出：买入需120日溃疡指数低于5%、收盘价高于20日均线、5日量比大于1.2、5日涨幅小于5%，按120日溃疡指数升序取前10；持有10日、止损8%，10日涨幅超过10%即止盈离场（短持有期只吃启动段，不承担衰减）。相对第1轮失败模式的改动：第1轮用"放量加新高"确认强度，本轮要求放量出现时价格还没涨；持有期从20到40日压到10日，避免趋势衰减期反向。
buy:
- {op: ulcer_n, n: 120, dir: below, threshold: 5}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
- {op: vol_ratio_n, n: 5, dir: above, threshold: 1.2}
- {op: ret_n, n: 5, dir: below, threshold: 5}
rank: {op: ulcer_n, n: 120, order: asc}
sell:
- {op: ret_n, n: 10, dir: above, threshold: 10}
max_hold_days: 10
stop_loss: 8%
max_positions: 10
industry_cap: 0
