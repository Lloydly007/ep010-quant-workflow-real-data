name: a_r2_s1_14_three_day_vacuum
type: rule
desc: 现象：3个交易日跌超8%（典型的突发急跌），但当日换手不到1%，且收盘距250日低点15%以内——跌得很急，却几乎没有成交。为什么A股该有超额：三天跌8%通常来自突发消息或大单冲击，而「跌完当天换手不到1%」说明没有跟风盘出逃、卖压即刻枯竭；在年内低位区，恐慌抛售的对手方往往是成本极低的资金，短期反弹的确定性最高。怎么进出：三条同时成立才买，rank按3日跌幅最深优先，5日量比放大到2倍以上（资金回流确认）即离场、10日上限、8%止损。相对第1轮失败模式：第1轮的急跌组（a_r1_s4_09 要求3日跌8%且放量2倍）方向正好相反——它要求「放量急跌」才买，实际买到的是恐慌破位的中段；本份改成「缩量急跌」入场，并把放量2倍移到卖出条件上（放量＝资金回流兑现），同一个零件被放到了正确的方向。
buy:
  - {op: ret_n, n: 3, dir: below, threshold: -8.0}
  - {op: turn, dir: below, threshold: 1.0}
  - {op: dist_low_n, n: 250, dir: below, threshold: 15.0}
rank: {op: ret_n, n: 3, order: asc}
sell:
  - {op: vol_ratio_n, n: 5, dir: above, threshold: 2.0}
max_hold_days: 10
stop_loss: 8%
industry_cap: 3
