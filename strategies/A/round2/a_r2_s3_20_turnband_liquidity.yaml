name: a_r2_s3_20_turnband_liquidity
type: rule
desc: "现象：换手太低（<1%）的突破常常无人承接，A股冷门票的突破最易次日无量回落；换手太高（>5%）又是情绪过热——第1轮把换手完全忽略，等于同时放进了这两类假突破。为什么该有超额：1%~5%的温和换手带既有真实资金参与、又没到情绪极值，再要求20日均换手<3%（最近一个月整体处于冷却状态），构成有流动性但不热的突破，这类形态的次日承接最稳。怎么进出：20日新高、当日换手1%~5%、20日均换手<3%才买；跌破10日线离场、持满10日、-8%止损；按20日均换手升序取最安静的10只。相对第1轮：第一次给换手设双边带（下限排除无人接盘的冷门票、上限排除情绪过热票），而不是只在单侧放宽或收紧。"
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: turn, dir: above, threshold: 1}
- {op: turn, dir: below, threshold: 5}
- {op: turn_ma_n, n: 20, dir: below, threshold: 3}
rank: {op: turn_ma_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 10, dir: below, threshold: 1.0}
max_hold_days: 10
stop_loss: 8%
max_positions: 10
industry_cap: 0
