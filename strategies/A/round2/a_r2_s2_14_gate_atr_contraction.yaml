name: a_r2_s2_14_gate_atr_contraction
type: rule
desc: 现象：第1轮的量能条件都是“放量越大越好”，买的是波动最剧烈的股票，而这类股票平均回撤最深。为何A股有超额：20日真实波幅占收盘价低于3%说明多空分歧收敛，此时仍站在20日线上方并保有20日正涨幅的股票，是分歧很小的一致上涨，指数上行期这类低波趋势的回撤显著小于高波趋势。进出：ETF120日线上方、ATR占收盘低于3%、站上20日线且20日涨幅超3%时买入，按ATR由低到高优先；跌破20日线离场，最长40日、8%止损、同行业最多10只。相对第1轮改动：把波动率从“越大越好”反转为“越小越好”，直接回应第1轮回撤中位-89.5%的失败模式。
buy:
- {op: etf_above_ma_n, n: 120, dir: above, threshold: 0.5}
- {op: atr_close_n, n: 20, dir: below, threshold: 3}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
- {op: ret_n, n: 20, dir: above, threshold: 3}
rank: {op: atr_close_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 40
stop_loss: 8%
max_positions: 10
industry_cap: 10
