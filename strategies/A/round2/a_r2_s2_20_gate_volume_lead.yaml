name: a_r2_s2_20_gate_volume_lead
type: rule
desc: 现象：第1轮的放量条件几乎都与突破同日出现，买的是价格已经兑现的那一根K线，而A股更常见的是量先起、价后动。为何A股有超额：20日量比高于1.2倍说明有增量资金进场，但20日涨幅仍低于8%说明价格尚未透支，这种“量在价先”的形态在指数上行期最容易在一到两个月内被定价，进场成本低于突破日。进出：ETF60日线上方、20日量比高于1.2倍、20日涨幅低于8%且站上20日线时买入，按20日量比降序优先；跌破20日线离场，最长20日、8%止损、同行业最多10只。相对第1轮改动：把放量从“突破的确认”改成“突破前的先行信号”，让买入发生在价格透支之前。
buy:
- {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
- {op: vol_ratio_n, n: 20, dir: above, threshold: 1.2}
- {op: ret_n, n: 20, dir: below, threshold: 8}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: vol_ratio_n, n: 20, order: desc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 10
