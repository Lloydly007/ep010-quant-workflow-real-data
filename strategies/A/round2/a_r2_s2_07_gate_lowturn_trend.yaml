name: a_r2_s2_07_gate_lowturn_trend
type: rule
desc: 现象：A股是高换手均值回归市场，第1轮没有任何一份配置看换手，买入的往往是刚被短线资金炒过一轮的股票。为何A股有超额：在指数上行期仍能保持20日平均换手低于3%的股票，说明持仓者以长线资金为主、没有获利盘抢跑，趋势更可能延续；高换手股票的后续超额在A股普遍为负。进出：ETF60日线上方、站上60日线、20日平均换手低于3%时买入，按换手由低到高优先；跌破60日线离场，最长60日、10%止损、同行业最多10只。相对第1轮改动：新增换手率作趋势质量闸门，排除第1轮反复踩中的高换手兑现盘。
buy:
- {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
- {op: turn_ma_n, n: 20, dir: below, threshold: 3}
rank: {op: turn_ma_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
max_hold_days: 60
stop_loss: 10%
max_positions: 10
industry_cap: 10
