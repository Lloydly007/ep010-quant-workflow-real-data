name: a_r2_s3_16_break120_shortcalm
type: rule
desc: "现象：第1轮突破窗口几乎全在20日，短窗口突破在A股噪声极大；半年新高（120日）才代表中期资金共识，但120日新高若短期已经暴涨又是追高。为什么该有超额：120日新高加60日线上方说明中期趋势成立，再用20日涨幅升序挑中期突破里短期冲得最少的票，等于只买突破的第一次呼吸，避开短期脉冲与情绪接力。怎么进出：120日新高、站在60日线上方、换手<8%才买；跌破60日线离场、持满40日、-10%止损、行业最多3只；按20日涨幅升序取短涨幅最小的10只。相对第1轮：把突破窗口与排序窗口错开（长窗判定突破、短窗反向排序），修掉第1轮长短期都在追最热造成的双重追涨。"
buy:
- {op: break_high_n, n: 120, dir: above, threshold: 0.5}
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
- {op: turn, dir: below, threshold: 8}
rank: {op: ret_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 3
