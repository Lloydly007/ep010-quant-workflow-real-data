name: a_r2_s1_20_slow_bleed_out
type: rule
desc: 现象：60日跌超15%，但60日日波动率低于2%、60日均换手低于1%——「慢速失血」而不是暴跌，跌幅被摊平在三个月里，既没有放量恐慌也没有快速反弹。为什么A股该有超额：慢跌意味着卖压是持续的小额抛售（解禁、产品赎回、评级下调），没有恐慌性放量，所以也没有V型反弹；但正因为波动低、筹码在低位被反复换手，一旦抛售停止，价格会沿原来的估值中枢缓慢修复，需要的持有期远长于急跌股。怎么进出：三条同时成立才买，rank按60日跌幅最深优先，收盘重回60日线上方离场、60日上限、10%止损。相对第1轮失败模式：第1轮A路100份里有44份持有上限≤10日、22份用5%止损，全部是短线抢反弹的设计，遇到「慢跌」这类需要时间的形态只会被时间成本与止损反复消耗——本份是A路第一份明确针对慢跌修复的60日持有设计，把「时间」本身当成假设变量，并用低波动＋低换手确认这不是趋势性崩塌。
buy:
  - {op: ret_n, n: 60, dir: below, threshold: -15.0}
  - {op: vol_n, n: 60, dir: below, threshold: 2.0}
  - {op: turn_ma_n, n: 60, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 60, order: asc}
sell:
  - {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
max_hold_days: 60
stop_loss: 10%
industry_cap: 10
