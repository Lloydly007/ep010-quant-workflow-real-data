name: a_r2_s4_20_path_exit_control
type: rule
desc: 现象（诊断假设）：入场沿用第1轮的追涨型信号（距120日高点5%以内、20日涨幅大于3%），唯一改动是把卖出从"跌破均线或持有到期"换成"路径损坏即卖"（60日溃疡指数升破15%）。为什么A股该有超额：第1轮A路100份的回撤中位达-89.5%，说明亏损主要来自持有到深跌而不是入场方向本身；A股趋势一旦破位常伴连续跌停与跳空，价格型止损会被滑点吃穿，而用波动路径（溃疡指数）作退出触发器，能在路径刚开始变脏时提前离场，不必等到价格破位。进出：买入需距120日高点不足5%、20日涨幅大于3%、120日溃疡指数低于10%，按20日涨幅降序取前10；持有60日、止损10%，60日溃疡指数升破15%即卖出。相对第1轮失败模式的改动：这是本轮唯一的"只改退出、不改入场"的对照配置，用来定位第1轮的失败到底来自入场还是来自退出；其余19份都同时改了入场口径，因此本份是解读它们的基准。
buy:
- {op: dist_high_n, n: 120, dir: above, threshold: -5}
- {op: ret_n, n: 20, dir: above, threshold: 3}
- {op: ulcer_n, n: 120, dir: below, threshold: 10}
rank: {op: ret_n, n: 20, order: desc}
sell:
- {op: ulcer_n, n: 60, dir: above, threshold: 15}
max_hold_days: 60
stop_loss: 10%
max_positions: 10
industry_cap: 0
