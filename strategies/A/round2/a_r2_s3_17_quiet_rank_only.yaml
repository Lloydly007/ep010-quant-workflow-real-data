name: a_r2_s3_17_quiet_rank_only
type: rule
desc: "现象：把换手不过热写成硬阈值（如<3%）会在活跃行情里把候选滤空、样本不足，而第1轮的失败未必在阈值，而在于用20日涨幅降序排序主动挑了最热的票。为什么该有超额：不过热应当是排序偏好而不是硬门槛——保留换手<15%的宽资格以保证候选量与L1笔数，再用20日均换手升序在候选里挑最安静的10只，既保住样本又把热度从绝对排除降级为相对偏好。怎么进出：20日新高、换手<15%、站在20日线上方才买；买候选里20日均换手最低的10只；跌破20日线离场、持满20日、-8%止损。相对第1轮：同源信号只改排序键（涨幅降序改为换手升序），用来单独检验排序键选错这一条失败原因，而不是靠缩紧阈值来改善数字。"
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: turn, dir: below, threshold: 15}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: turn_ma_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
