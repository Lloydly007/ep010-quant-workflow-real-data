name: a_r2_s1_08_ma60_dip_dry
type: rule
desc: 现象：收盘跌破60日线（A股最被广泛引用的中期成本线），但仍站在250日线上方，同时5日跌超8%、5日量比低于1.0——「关键均线被破，可是无量」。为什么A股该有超额：60日线是技术止损最密集的位置，缩量跌破说明是技术性假破位而非趋势反转；当破位由少数筹码砸出、长期趋势还在，修复概率显著高于趋势反转，这是被系统性忽略的一类时点。怎么进出：四条同时成立才买，rank按60日涨幅由高到低（中期仍最强者先买，避开真破位），收盘重回20日线上方离场、40日上限、8%止损。相对第1轮失败模式：第1轮A路的均线组几乎全部是「站上均线才买」（a_r1_s3_02/a_r1_s4_03 等），把破位一律当卖出信号或干脆不参与，系统性放弃了「缩量假破位」这一段；本份专门交易该时点，并用250日线把真破位整段排除，止损收到8%以控制判断错误的代价。
buy:
  - {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
  - {op: close_over_ma_n, n: 250, dir: above, threshold: 1.0}
  - {op: ret_n, n: 5, dir: below, threshold: -8.0}
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 1.0}
rank: {op: ret_n, n: 60, order: desc}
sell:
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
max_hold_days: 40
stop_loss: 8%
industry_cap: 3
