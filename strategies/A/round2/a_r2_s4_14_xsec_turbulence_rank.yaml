name: a_r2_s4_14_xsec_turbulence_rank
type: rule
desc: 现象：距250日高点10%以内、60日涨幅大于2%的强势股中，按20日ATR除以收盘做全市场截面分位，处在最安静一档的股票后续回撤明显更浅。为什么A股该有超额：低波动异象在A股长期存在（散户偏好高波动，机构因容量约束偏好低波动），而"接近年内高点加低振幅"同时满足趋势与容量两个条件，是机构可以真正加仓的形态；高振幅的强势股在指数调整时最先被减仓，回撤远大于低振幅同类。进出：买入需距250日高点不足10%、60日涨幅大于2%、120日溃疡指数低于10%，排序键用 xsec_pct 套 ATR除以收盘(20) 升序取10只；持有40日、止损10%，跌离250日高点超过15%即卖出。相对第1轮失败模式的改动：第1轮的排序键是涨幅或量比（越猛越买），本轮排序键是振幅的截面分位（越安静越买），并把趋势准入限定在年内高点附近，兼顾了第1轮正确的部分（要有趋势）与错误的部分（不能追猛）。
buy:
- {op: dist_high_n, n: 250, dir: above, threshold: -10}
- {op: ret_n, n: 60, dir: above, threshold: 2}
- {op: ulcer_n, n: 120, dir: below, threshold: 10}
rank: {op: xsec_pct, of: {op: atr_close_n, n: 20}, order: asc}
sell:
- {op: dist_high_n, n: 250, dir: below, threshold: -15}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 10
