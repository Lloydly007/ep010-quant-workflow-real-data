name: a_r2_s1_11_streak_dry_exhaust
type: rule
desc: 现象：连续下跌超过5个交易日（即至少6连阴），同时5日量比低于0.8、当日换手不足1%——最长的连跌，却是最轻的成交量。为什么A股该有超额：连跌是A股散户情绪最极端的形态，但「无量连跌」说明抛压是自然衰减而不是集中出逃；融资盘与短线止损盘通常在连跌第3~5日集中释放，第6日之后没有新增卖盘，价格对买盘极其敏感，这是A股连跌形态里唯一赔率与胜率同时占优的一段。怎么进出：三条同时成立才买，rank按连跌天数由多到少（最极端者先买），收盘重回20日线上方离场、20日上限、不设止损（连跌末端的止损单本身就是被吃掉的流动性）。相对第1轮失败模式：第1轮的连跌组（a_r1_s4_14 只用streak_down>5＋5日持有＋5%止损＋按5日跌幅排序）把连跌当唯一条件，结果在放量连跌里反复接刀、再被5%止损扫出；本份要求连跌必须同时是「无量＋低换手」，取消止损，把持有期给到20日，让第6日之后的抛压真空自己兑现。
buy:
  - {op: streak_down, dir: above, threshold: 5}
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 0.8}
  - {op: turn, dir: below, threshold: 1.0}
rank: {op: streak_down, order: desc}
sell:
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
max_hold_days: 20
stop_loss: 无
industry_cap: 10
