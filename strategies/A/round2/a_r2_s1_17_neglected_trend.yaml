name: a_r2_s1_17_neglected_trend
type: rule
desc: 现象：60日均换手低于1%（半年内被整个市场冷落）、收盘仍在120日线上方（趋势完好），但20日跌超8%——长期无人关注、却在悄悄走强的股票被砸了一下。为什么A股该有超额：低换手＋趋势完好的股票通常是被长线资金锁仓的品种，日常成交由被动与长线构成；它的急跌多来自流动性事件，缺少跟风卖盘，修复路径是缓慢而持续的（不需要情绪推动），因此适合长持有。A股机构化进程中这类「低换手慢牛」越来越多，而第1轮A路100份全部在高换手的活跃股里选股，系统性地错过了这一类样本。怎么进出：三条同时成立才买，rank按60日均换手由低到高，20日量比放大到1.5倍（资金重新关注）即离场、40日上限、10%止损。相对第1轮失败模式：A路没有一份以「低换手」为买入前提（换手只在B路当过滤条件），本份把换手从排除项变成选股主轴，并用放量作为退出信号而不是入场信号——这与第1轮「放量突破买入」完全相反。
buy:
  - {op: turn_ma_n, n: 60, dir: below, threshold: 1.0}
  - {op: close_over_ma_n, n: 120, dir: above, threshold: 1.0}
  - {op: ret_n, n: 20, dir: below, threshold: -8.0}
rank: {op: turn_ma_n, n: 60, order: asc}
sell:
  - {op: vol_ratio_n, n: 20, dir: above, threshold: 1.5}
max_hold_days: 40
stop_loss: 10%
industry_cap: 5
