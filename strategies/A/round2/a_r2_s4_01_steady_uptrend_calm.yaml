name: a_r2_s4_01_steady_uptrend_calm
type: rule
desc: 现象：站上60日线且60日涨幅为正的股票里，120日溃疡指数（窗口内回撤平方均值开方）最低的一批长期强于同类趋势股（实测全池 ulc120 中位 12.6%，中位以下的样本里路径差异极大）。为什么A股该有超额：涨停板加T+1 让情绪资金集中在少数标的，陡峭上涨的票持有成本堆积在高位，缺增量资金即集体抛售；平滑上涨意味着筹码被长时间吸收、缺少集中获利盘，趋势延续概率高且波动拖累小。进出：买入需收盘价高于60日均线、60日涨幅大于2%、120日溃疡指数低于5%（该门全池约6.3%、日均约80只，叠加趋势条件后日均约60只候选），按120日溃疡指数升序取最干净的10只；持有40日、止损10%，卖出条件为120日溃疡指数升破8%（路径损坏）而非跌破某条均线。相对第1轮失败模式（A路100份中位年化-17.9%、L2通过0份、追涨买在高点）的改动：完全不用突破/新高/放量入场，改为在趋势内部按路径干净程度排序，并把卖点从价位破位换成路径损坏。
buy:
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
- {op: ret_n, n: 60, dir: above, threshold: 2}
- {op: ulcer_n, n: 120, dir: below, threshold: 5}
rank: {op: ulcer_n, n: 120, order: asc}
sell:
- {op: ulcer_n, n: 120, dir: above, threshold: 8}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 0
