name: a_r2_s3_03_volband_moderate
type: rule
desc: "现象：第1轮突破组用5日量比>1.5的单价确认，只保留爆量突破；A股爆量日多是散户与游资集中进场的情绪高潮，次日承接力最弱。为什么该有超额：温和放量（量比1.2~2.0倍）说明有增量资金但未到情绪极值，突破后仍有接盘空间，换手<8%的上限再把爆量高换手票彻底排除。怎么进出：20日新高且5日量比落在1.2~2.0的温和带、换手<8%、站在20日线上方才买；跌破20日线离场、持满20日、-8%止损，行业最多5只；候选按20日涨幅升序取涨得最少的10只（突破但不追短脉冲）。相对第1轮：给量能加上界而不只是下界，并把排序键从追涨幅最大改为优先短涨幅，同时修掉第1轮的两个追涨来源。"
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: vol_ratio_n, n: 5, dir: above, threshold: 1.2}
- {op: vol_ratio_n, n: 5, dir: below, threshold: 2.0}
- {op: turn, dir: below, threshold: 8}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: ret_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 5
