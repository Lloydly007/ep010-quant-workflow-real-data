name: a_r2_s3_08_slow_newhigh250
type: rule
desc: "现象：年度新高是机构与散户共同关注的信息事件，但A股年度新高日往往伴随巨量换手与短期暴涨，第1轮把突破窗口压在20日、持有压到10日、止损8%，等于既追了短脉冲又被噪声震出。为什么该有超额：250日新高加5日涨幅<8%说明突破不带情绪脉冲、没有短期获利盘，加换手<5%确认年度级别的新高发生在冷却状态，这类慢突破的右尾最长。怎么进出：250日新高、5日涨幅<8%、换手<5%才买；从250日高点回落10%（长周期结构破坏）才卖，持满40日、-10%止损；按250日涨幅降序取趋势最长的10只。相对第1轮：把突破周期从20日拉到250日、持有期从10日拉到40日并放宽止损，检验假突破过滤是否该用长周期低频持有实现，而不是加更多短周期条件。"
buy:
- {op: break_high_n, n: 250, dir: above, threshold: 0.5}
- {op: ret_n, n: 5, dir: below, threshold: 8}
- {op: turn, dir: below, threshold: 5}
rank: {op: ret_n, n: 250, order: desc}
sell:
- {op: dist_high_n, n: 250, dir: below, threshold: -10}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 0
