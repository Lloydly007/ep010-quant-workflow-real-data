name: a_r2_s1_06_trend_dip_dry
type: rule
desc: 现象：收盘仍在250日线上方（长期趋势未破），但20日跌超8%、且20日均换手回落到2%以下——趋势股的缩量深调。为什么A股该有超额：A股的主线／抱团股在趋势中段的回调通常是机构换手，缩量说明没有机构在出货；等换手冷却到2%以下，增量资金接回的概率高。这恰好是第1轮「追涨」策略的镜像：它在趋势加速段买、买在阶段高点，本份在同一批股票回落到缩量末端时买。怎么进出：三条同时成立才买，rank按20日跌幅由深到浅（回调最充分者先买），20日涨幅达到10%即兑现、40日上限、10%止损。相对第1轮失败模式：第1轮的顺势组（a_r1_s3_01/a_r1_s2_19 均线多头排列）在均线上方无差别买入，等于长期停留在阶段高点附近，这正是A路年化中位-17.9%的主要来源；本份保留趋势判断，但把入场从「右侧追价」改成「左侧接缩量回调」，并用20日均换手与量比确认卖压枯竭。
buy:
  - {op: close_over_ma_n, n: 250, dir: above, threshold: 1.0}
  - {op: ret_n, n: 20, dir: below, threshold: -8.0}
  - {op: turn_ma_n, n: 20, dir: below, threshold: 2.0}
rank: {op: ret_n, n: 20, order: asc}
sell:
  - {op: ret_n, n: 20, dir: above, threshold: 10.0}
max_hold_days: 40
stop_loss: 10%
industry_cap: 5
