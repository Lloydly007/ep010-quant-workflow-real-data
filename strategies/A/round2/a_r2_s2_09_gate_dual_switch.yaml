name: a_r2_s2_09_gate_dual_switch
type: rule
desc: 现象：第1轮的回撤中位约-89.5%，原因是多数配置只把ETF当进场闸门、离场仍靠个股均线，系统性下跌时10只票同时被埋。为何A股有超额：沪深300ETF跌破20日线往往先于个股破位，是A股最灵敏的风险偏好拐点；用它做组合级清仓开关，能把β下行段整段空仓，同时保留个股趋势的完整上涨段。进出：ETF60日线上方、个股站上120日线且60日涨幅超3%时买入，按60日涨幅降序优先；唯一卖出条件是ETF跌破20日线（组合级清仓），不设个股卖点，最长60日、10%止损、同行业最多10只。相对第1轮改动：把ETF从单向进场闸门升级为“进用60日线、出用20日线”的双向开关，直接对准第1轮回撤失控的主因。
buy:
- {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
- {op: close_over_ma_n, n: 120, dir: above, threshold: 1.0}
- {op: ret_n, n: 60, dir: above, threshold: 3}
rank: {op: ret_n, n: 60, order: desc}
sell:
- {op: etf_above_ma_n, n: 20, dir: below, threshold: 0.5}
max_hold_days: 60
stop_loss: 10%
max_positions: 10
industry_cap: 10
