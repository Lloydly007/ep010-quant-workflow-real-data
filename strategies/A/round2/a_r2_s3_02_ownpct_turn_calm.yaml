name: a_r2_s3_02_ownpct_turn_calm
type: rule
desc: "现象：绝对换手水平被市值与行业扭曲（银行1%与中证500票3%不可比），第1轮没有任何相对自身的热度度量。为什么该有超额：换手率的时序分位比绝对水平更能识别情绪是否启动——在自身20日换手分布里处于低分位的突破，是筹码沉淀后的真突破；处于高分位的突破多是接力资金末端。怎么进出：60日新高加换手<8%的宽松绝对上限做硬门槛，再用20日换手时序分位（ts_pct）升序在候选里挑最冷的10只；从60日高点回落8%即离场、持满20日、-10%止损。相对第1轮：把过热判断从绝对阈值改成相对自身历史的分位排序，修掉第1轮用ret_n降序排序专挑最热票的失败模式。"
buy:
- {op: break_high_n, n: 60, dir: above, threshold: 0.5}
- {op: turn, dir: below, threshold: 8}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: ts_pct, n: 20, of: {op: turn}, order: asc}
sell:
- {op: dist_high_n, n: 60, dir: below, threshold: -8}
max_hold_days: 20
stop_loss: 10%
max_positions: 10
industry_cap: 0
