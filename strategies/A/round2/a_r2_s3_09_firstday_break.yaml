name: a_r2_s3_09_firstday_break
type: rule
desc: "现象：A股假突破高发在连涨3~5日之后的衰竭突破，而第1轮动量组把连涨当成正向买点（streak_up>3、按连涨天数降序），正好在最贵的一天进场。为什么该有超额：连涨不足3日的首日突破没有累积获利盘，次日抛压小；配合换手<5%与收盘位置>0.8，首日突破加强收盘是本池里最干净的真突破形态。怎么进出：20日新高、连涨<3日、换手<5%、收盘在当日振幅80%以上才买；跌破10日线、持满10日、-8%止损；按20日均换手升序取最安静的10只。相对第1轮：把连涨从正向信号改成负向约束，直接反转第1轮追动量末端的入场逻辑。"
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: streak_up, dir: below, threshold: 3}
- {op: turn, dir: below, threshold: 5}
- {op: close_pos_range, dir: above, threshold: 0.8}
rank: {op: turn_ma_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 10, dir: below, threshold: 1.0}
max_hold_days: 10
stop_loss: 8%
max_positions: 10
industry_cap: 0
