name: a_r2_s5_03_pool_rs20_calm
type: rule
desc: 现象：20 日截面动量排名最靠前的股票，常常已经连拉多日、单日量能放到 2 倍以上，那是情绪加速段而不是资金建仓段，A 股高换手的均值回归会把这一段溢价全部吃掉。为什么在 A 股该有超额：把“未过热”写成入场的必要条件（连涨不足 3 日、5 日量比低于 2 倍），等于只买相对强度仍在形成期的股票，赚扩散而不接最后一棒；这是对第 1 轮追涨类假设买在高点的系统性修正。怎么进出：站上 20 日线、5 日量比低于 2 倍且连涨不足 3 日者，按 20 日涨幅的全池截面分位降序取前 10；收盘跌破 20 日线离场，10 日上限、8% 止损。相对第 1 轮的改动：第 1 轮把“已经涨得多”本身当买入理由；本配置在相对强度之外加两条过热排除条件，把入场点从加速段挪到扩散段。
buy:
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
- {op: vol_ratio_n, n: 5, dir: below, threshold: 2.0}
- {op: streak_up, dir: below, threshold: 3}
rank: {op: xsec_pct, of: {op: ret_n, n: 20}, order: desc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 10
stop_loss: 8%
max_positions: 10
