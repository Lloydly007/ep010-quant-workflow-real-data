name: a_r2_s1_13_lowvol_mispricing
type: rule
desc: 现象：20日日收益标准差低于2%（典型的低波动股），却出现20日跌超10%、且20日均换手低于2%——「最不该大跌的股票大跌了」。为什么A股该有超额：低波动股多是被动资金与长线机构的底仓，价格由基本面而非情绪驱动，急跌很少来自趋势性卖压；低波动本身也意味着缺乏下跌动量，跌完之后继续下行的空间有限，而回归常态估值区的动力稳定——这是A股低波异象（低波组合长期跑赢）在短周期上的镜像。怎么进出：三条同时成立才买，rank按20日波动率由低到高（最「不该跌」的先买），收盘重回20日线上方离场、40日上限、10%止损。相对第1轮失败模式：第1轮A路100份完全没有波动率维度（vol_n只在B路当过滤条件），全部押在量价形态上，等于长期在高波动股里被反复甩动，回撤中位-89.5%正是这样来的；本份用「低波＋低换手」双重确认，专做不应发生的下跌，并把持有期给到40日以避免短期噪声。
buy:
  - {op: vol_n, n: 20, dir: below, threshold: 2.0}
  - {op: ret_n, n: 20, dir: below, threshold: -10.0}
  - {op: turn_ma_n, n: 20, dir: below, threshold: 2.0}
rank: {op: vol_n, n: 20, order: asc}
sell:
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
max_hold_days: 40
stop_loss: 10%
industry_cap: 10
