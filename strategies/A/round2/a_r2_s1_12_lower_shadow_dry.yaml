name: a_r2_s1_12_lower_shadow_dry
type: rule
desc: 现象：当日收盘位于日内振幅上沿80%以上（长下影或尾盘拉起），但5日仍跌超8%、20日均换手低于2%——「跌了很多、最后收得很强、可是没什么人交易」。为什么A股该有超额：收盘位置是A股当日资金意图最直接的痕迹，日内被打下去又被买回来，说明存在真实承接盘；叠加5日超跌与低换手，构成「恐慌日被接走＋没有跟风抛压」的组合，次日延续反弹的概率高于继续下跌。怎么进出：三条同时成立才买，rank按「收盘位置在自身120日内的时序分位」由高到低，10日内反弹8%离场、10日上限、8%止损。相对第1轮失败模式：第1轮的日内结构组（a_r1_s4_11/a_r1_s3_13）用收盘位置去追当日最强的股票，方向是买在日内高点；本份把同一个零件用在超跌股上，只在「跌了很多但收得强」时买——收盘位置信号的反向使用，并用低换手把「放量拉尾盘」的出货形态排除。
buy:
  - {op: close_pos_range, dir: above, threshold: 0.8}
  - {op: ret_n, n: 5, dir: below, threshold: -8.0}
  - {op: turn_ma_n, n: 20, dir: below, threshold: 2.0}
rank: {op: ts_pct, n: 120, of: {op: close_pos_range}, order: desc}
sell:
  - {op: ret_n, n: 10, dir: above, threshold: 8.0}
max_hold_days: 10
stop_loss: 8%
industry_cap: 5
