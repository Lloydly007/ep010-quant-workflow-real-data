name: a_r2_s2_04_gate_washout_reclaim
type: rule
desc: 现象：第1轮把连跌当反向信号（跌深了买），但下跌趋势中的接刀与上涨趋势内的洗盘无法区分，接刀类配置贡献了大量亏损。为何A股有超额：指数在60日线上方时个股连跌3日以上多为浮筹离场，收盘重新站上20日线是洗盘结束的确认，此时进场比下跌中途接刀和冲高日追买都更靠右、成本更低。进出：ETF60日线上方、个股连跌3日以上、收盘回到20日线上方且20日涨幅转正（超2%）时买入，按20日涨幅最温和者优先；跌破20日线离场，最长10日、5%止损、同行业最多5只。相对第1轮改动：把“跌深即买”改成“跌完且收复均线才买”，并加上市场状态闸门。
buy:
- {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
- {op: streak_down, dir: above, threshold: 3}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
- {op: ret_n, n: 20, dir: above, threshold: 2}
rank: {op: ret_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 10
stop_loss: 5%
max_positions: 10
industry_cap: 5
