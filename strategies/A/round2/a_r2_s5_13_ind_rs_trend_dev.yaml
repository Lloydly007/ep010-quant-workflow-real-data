name: a_r2_s5_13_ind_rs_trend_dev
type: rule
desc: 现象：行业上行期，行业内资金最先涌入的是趋势走得最远的那只（收盘对 60 日线偏离最大），而不是当天涨得最多的那只；第 1 轮用涨幅排序，把“当天一根阳线”和“三个月趋势”混为一谈。为什么在 A 股该有超额：偏离度衡量行业内持仓成本的抬升幅度，偏离越大说明行业内资金越集中、浮盈结构越好；A 股行业行情通常由一只龙头带动，龙头的偏离度变化早于行业指数。怎么进出：300ETF 站上 120 日线时，从站上 60 日线的股票中按同门类内“收盘对 60 日线偏离度”排名降序取前 10；跌破 60 日线离场，20 日上限、8% 止损、同行业最多 3 只。相对第 1 轮的改动：第 1 轮行业内排序用收益率，短期波动主导排序；本配置改用趋势偏离度做行业内排序键，并用 ETF 把策略限制在市场上行状态。
buy:
- {op: etf_above_ma_n, n: 120, dir: above, threshold: 0.5}
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
rank: {op: ind_rank, of: {op: close_over_ma_n, n: 60}, order: desc}
sell:
- {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 3
