name: a_r2_s4_15_bounded_drift
type: rule
desc: 现象：60日涨幅落在2%到10%这个温和上行带的股票，下一阶段表现好于涨幅超过30%的加速股与跌幅为负的下跌股（该带叠加120日溃疡指数低于8%的路径条件后日均约58只候选，band 本身即筛选器）。为什么A股该有超额：A股短期涨幅与随后收益呈倒U型，极端涨幅组反转显著，第1轮A路100份配置年化中位-17.9%正是买在最陡的一段；把动量限制在温和带，等于只买"有趋势但没被炒热"的部分，既保留动能又避开获利盘集中兑现。进出：买入需60日涨幅大于2%且小于10%、120日溃疡指数低于8%，在带内按60日涨幅降序取相对最强的10只；持有20日、止损8%，60日涨幅转负低于-5%（温和上行带被证伪）即卖出。相对第1轮失败模式的改动：第1轮只需要"涨得多"，本轮给涨幅加上上限，是针对"追涨买在高点"最直接的反向设计；本份与第16份（只要路径干净就允许强动量）构成互斥的竞争假设，二者的结果可用来判断失败模式究竟来自涨幅本身还是来自路径质量。
buy:
- {op: ret_n, n: 60, dir: above, threshold: 2}
- {op: ret_n, n: 60, dir: below, threshold: 10}
- {op: ulcer_n, n: 120, dir: below, threshold: 8}
rank: {op: ret_n, n: 60, order: desc}
sell:
- {op: ret_n, n: 60, dir: below, threshold: -5}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
