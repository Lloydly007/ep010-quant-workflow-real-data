name: a_r2_s1_07_near_high_flush
type: rule
desc: 现象：股价距250日高点不到15%（仍处在高位区），却在10个交易日内跌超10%、且5日量比低于0.8——高位急跌却不放量。为什么A股该有超额：高位急跌＋缩量是题材股洗盘的典型形态，主力用少量筹码砸出恐慌而不真正换手；A股散户对「高位大阴线」的止损反应过度，而缩量证明筹码没有大规模易手，洗盘结束后价格往往回到前高附近，这段修复的赔率远高于继续下跌的空间。怎么进出：三条同时成立才买，rank按10日跌幅最深优先，收盘重回20日线上方（洗盘结束的价格确认）离场、20日上限、10%止损。相对第1轮失败模式：第1轮的强势组（a_r1_s1_07/a_r1_s5_03）也看「贴近高点＋缩量」，方向却是追高做多；本份保留「靠近高点＋缩量」这两个第1轮验证过的零件，但先要求出现10%以上的急跌，把买点从「高位平台」挪到「洗盘之后」——同一组零件的反向使用，而不是换参数。
buy:
  - {op: dist_high_n, n: 250, dir: above, threshold: -15.0}
  - {op: ret_n, n: 10, dir: below, threshold: -10.0}
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 0.8}
rank: {op: ret_n, n: 10, order: asc}
sell:
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
max_hold_days: 20
stop_loss: 10%
industry_cap: 5
