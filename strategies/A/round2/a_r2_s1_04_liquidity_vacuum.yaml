name: a_r2_s1_04_liquidity_vacuum
type: rule
desc: 现象：20日均换手不足1%的长期冷门股，5个交易日内突然跌超8%——平时一天只成交几千万，几天之内跌掉一年振幅。为什么A股该有超额：这类股票平时成交清淡，单日大跌多来自被动赎回、大单砸盘或指数调仓，属于「流动性折价」而非基本面恶化；因为缺少持续卖压，冲击结束后价格倾向回到冲击前水平，这是A股中盘股上最稳定的短周期均值回归来源，也是第1轮追涨类总买在流动性冲击高点的同一枚硬币。怎么进出：两条同时成立才买，rank按当日换手最低优先（冲击时最没有承接者、弹性最大），10日内出现10%以上的反弹即离场、8%止损、持有上限10日。相对第1轮失败模式：第1轮A路完全没有「换手」维度（换手只在B路当过滤），超跌组又是在高换手股票里按跌幅排序，等于专挑最拥挤的下跌股；本份第一次把「平时没人交易」设为买入前提，并且只做10日内的流动性冲击修复，不去猜长期趋势。
buy:
  - {op: turn_ma_n, n: 20, dir: below, threshold: 1.0}
  - {op: ret_n, n: 5, dir: below, threshold: -8.0}
rank: {op: turn, order: asc}
sell:
  - {op: ret_n, n: 10, dir: above, threshold: 8.0}
max_hold_days: 10
stop_loss: 8%
industry_cap: 0
