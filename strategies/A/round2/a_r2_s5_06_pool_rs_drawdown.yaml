name: a_r2_s5_06_pool_rs_drawdown
type: rule
desc: 现象：用涨幅衡量相对强度会被几只弹性极大的个股扭曲，而“距 250 日高点的距离”是稳健口径——一年里回撤最浅的那批股票，本质上就是被资金持续托住的相对强者。为什么在 A 股该有超额：亏损处置效应让深度回撤股的持有者变成持续卖盘，贴近 52 周高点的股票上方套牢盘最少、抛压最轻；横截面排序保证只在全池最抗跌的少数里选，而不是把所有回撤浅的股票一起买。怎么进出：距 250 日高点 15% 以内且站上 60 日线者，按距高点距离的全池截面分位降序取前 10；跌出 15% 之外即认输离场，40 日上限、10% 止损、同行业最多 5 只。相对第 1 轮的改动：第 1 轮的相对强度全部用收益率刻画；本配置把相对强度换成回撤距离口径并直接当排序键，避免普涨期涨幅指标集体虚高。
buy:
- {op: dist_high_n, n: 250, dir: above, threshold: -15}
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
rank: {op: xsec_pct, of: {op: dist_high_n, n: 250}, order: desc}
sell:
- {op: dist_high_n, n: 250, dir: below, threshold: -15}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 5
