name: a_r2_s2_18_gate_ind_relative
type: rule
desc: 现象：第1轮用绝对动量选股，当某个行业整体反弹时行业里最弱的股票也能满足动量条件而被买入，板块回落时这批弱势股跌得最多。为何A股有超额：指数上行期，同一行业内动量分位最高的股票是资金真正选择的龙头，行业内相对强度比绝对动量更不容易被板块β冒充，能过滤“板块涨、个股弱”的假信号。进出：ETF60日线上方、站上60日线、60日涨幅超2%时买入，按行业内60日动量分位降序优先；跌破60日线离场，最长40日、8%止损、同行业最多10只。（行业字段为证监会门类单期快照，只能作近似分层，结论不可外推到申万历史行业。）相对第1轮改动：把选股口径从全市场绝对动量改成行业内相对强度，补上第1轮“板块β冒充个股趋势”的漏洞。
buy:
- {op: etf_above_ma_n, n: 60, dir: above, threshold: 0.5}
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
- {op: ret_n, n: 60, dir: above, threshold: 2}
rank: {op: ind_rank, of: {op: ret_n, n: 60}, order: desc}
sell:
- {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
max_hold_days: 40
stop_loss: 8%
max_positions: 10
industry_cap: 10
