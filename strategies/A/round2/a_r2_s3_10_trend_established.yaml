name: a_r2_s3_10_trend_established
type: rule
desc: "现象：第1轮含大量距低点2%以内、低位支撑类买点，实际买在半山腰——A股底部第一次冲高的失败率远高于趋势中段的突破。为什么该有超额：已从20日低点抬起10%以上说明中期资金已经进场，此时出现的突破是趋势中继而非一次性反弹；换手<5%保证这不是情绪脉冲。怎么进出：60日新高、距20日低点>10%、换手<5%、收盘在上半区才买；跌破60日线（中期趋势破位）才卖，持满40日、-10%止损、行业最多5只；按120日涨幅降序。相对第1轮：用已脱离阶段低点这一条件过滤掉底部假突破，并把卖出条件从短期均线改成中期均线，减少被日内噪声打掉。"
buy:
- {op: break_high_n, n: 60, dir: above, threshold: 0.5}
- {op: dist_low_n, n: 20, dir: above, threshold: 10}
- {op: turn, dir: below, threshold: 5}
- {op: close_pos_range, dir: above, threshold: 0.5}
rank: {op: ret_n, n: 120, order: desc}
sell:
- {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 5
