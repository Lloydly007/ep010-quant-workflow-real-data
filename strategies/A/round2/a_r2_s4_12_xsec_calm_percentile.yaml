name: a_r2_s4_12_xsec_calm_percentile
type: rule
desc: 现象：全市场按120日溃疡指数排序，最干净的一档（截面分位最低）叠加120日涨幅大于3%的准入，能持续强于等权全池（无门槛时该分位档里混入大量走平或阴跌的"死水股"，所以必须给动量准入）。为什么A股该有超额：等权全池的收益被大量高波动、深回撤股票的高换手损耗拖住（第1轮实测全池等权年化+15.11%，但2018年-29%、2015年+82%，波动极大）；只保留路径受损最少且仍在上行的一档，等于剔除了均值回归最强的那部分。用截面分位而非绝对阈值，可自动适应当年整体风险水平。进出：买入需120日涨幅大于3%、120日溃疡指数低于10%，排序键用 xsec_pct 套 溃疡指数(120) 升序取10只；持有40日、止损10%，120日涨幅跌破-10%即卖出。相对第1轮失败模式的改动：第1轮A路的排序键是动量（越涨越买），本轮排序键换成路径损伤的截面分位，动量只作准入门槛、不参与排序，从机制上断开"追涨买在高点"。
buy:
- {op: ret_n, n: 120, dir: above, threshold: 3}
- {op: ulcer_n, n: 120, dir: below, threshold: 10}
rank: {op: xsec_pct, of: {op: ulcer_n, n: 120}, order: asc}
sell:
- {op: ret_n, n: 120, dir: below, threshold: -10}
max_hold_days: 40
stop_loss: 10%
max_positions: 10
industry_cap: 10
