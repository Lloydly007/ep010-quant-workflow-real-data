name: a_r2_s2_13_gate_newhigh250_hold
type: rule
desc: 现象：第1轮的新高类配置持有10到20日，创新高后被均值回归打回、止损频繁，而创250日新高在A股意味着上方已无套牢盘。为何A股有超额：指数在120日线上方时出现的250日新高，是资金对全市场定价上沿的突破，这类股票在随后一个季度里继续跑赢，需要更长持有期才拿得到，第1轮的短持有把这段收益切掉了。进出：ETF120日线上方、创250日新高、站上20日线时买入，按120日涨幅降序优先；跌破60日线离场，最长60日、10%止损、同行业最多5只。相对第1轮改动：把“新高”从短打信号改成中期持有信号，卖出从20日线放宽到60日线，让新高后的趋势跑完。
buy:
- {op: etf_above_ma_n, n: 120, dir: above, threshold: 0.5}
- {op: break_high_n, n: 250, dir: above, threshold: 0.5}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: ret_n, n: 120, order: desc}
sell:
- {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
max_hold_days: 60
stop_loss: 10%
max_positions: 10
industry_cap: 5
