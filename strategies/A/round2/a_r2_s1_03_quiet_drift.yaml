name: a_r2_s1_03_quiet_drift
type: rule
desc: 现象：连跌超过3个交易日、5日量比低于0.8、当日换手不足1%，即典型的「无量阴跌」——价格在跌，但没有任何人在大量卖出。为什么A股该有超额：缩量阴跌是抛压自然衰减的形态，没有增量卖盘，价格靠情绪漂移；A股散户持仓分散，连跌几日后的止损盘在缩量环境下迅速耗尽，此后任何边际买盘都能把价格推回短期均值，这正是A股「高换手均值回归」在高换手股之外的另一半样本。怎么进出：三条同时成立才买，rank用「当日换手在自身250日内的时序分位」由低到高（最没人交易者优先），收盘重回20日线上方视为回归完成离场，20日上限、10%止损。相对第1轮失败模式：第1轮同类（a_r1_s3_12 连跌＋20日超跌）是5日持有＋8%止损＋按跌幅排序，本质是「反弹当天就跑」的抢帽子，成交成本吃掉全部边际；本份把「成交量枯竭」做成核心买入条件，持有期翻四倍到20日，让无量阴跌后的均值回归真正有时间走完。
buy:
  - {op: streak_down, dir: above, threshold: 3}
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 0.8}
  - {op: turn, dir: below, threshold: 1.0}
rank: {op: ts_pct, n: 250, of: {op: turn}, order: asc}
sell:
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
max_hold_days: 20
stop_loss: 10%
industry_cap: 3
