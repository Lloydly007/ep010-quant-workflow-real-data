name: a_r2_s1_10_flat_year_crash
type: rule
desc: 现象：过去250日涨跌幅在-10%以内（一年基本白干），但最近20日跌超15%、20日均换手低于2%——年度持平股突然崩跌。为什么A股该有超额：一年没涨的股票本身没有获利盘，20日跌15%几乎没有基本面理由，多是个股事件（解禁、评级下调、指数调出、被动卖出）造成的错杀；它也不是趋势股，缺少「下跌—止损—再下跌」的正反馈，所以修复窗口比深跌股干净得多。怎么进出：三条同时成立才买，rank按20日跌幅最深优先，20日涨幅达到10%兑现、20日上限、10%止损。相对第1轮失败模式：第1轮的深跌组（a_r1_s3_04 要求250日线下方＋60日跌15%）专挑长期下跌股，等于在趋势性熊股里找反弹，这类样本在2018与2022年成片亏损；本份反过来用「250日涨跌幅>-10%」把长期下跌股整段排除，只做「年度持平＋短期崩跌」的事件型修复，这是选股域的改变而不是阈值的微调。
buy:
  - {op: ret_n, n: 250, dir: above, threshold: -10.0}
  - {op: ret_n, n: 20, dir: below, threshold: -15.0}
  - {op: turn_ma_n, n: 20, dir: below, threshold: 2.0}
rank: {op: ret_n, n: 20, order: asc}
sell:
  - {op: ret_n, n: 20, dir: above, threshold: 10.0}
max_hold_days: 20
stop_loss: 10%
industry_cap: 5
