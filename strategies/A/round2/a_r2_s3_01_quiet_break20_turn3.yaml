name: a_r2_s3_01_quiet_break20_turn3
type: rule
desc: "现象：A股假突破大多出现在换手骤升的情绪脉冲里，突破日换手偏高（>8%）的票T+1回落概率明显更高。为什么该有超额：换手率是A股最稳定的短期反转变量，低换手突破意味着筹码未易手、没有急于兑现的获利盘，突破后有承接空间。怎么进出：20日新高且突破日换手<3%、收盘位于当日振幅上半区（close_pos_range>0.5，即突破日没有冲高回落）才买；跌破10日线离场，持满10日、-8%止损；候选多于空位时按20日均换手升序取最安静的10只。相对第1轮：第1轮突破组只看价格与量比、从不把换手写进条件，等于专挑情绪最热的票（追涨买在脉冲顶）——本份首次把换手率当成突破的准入条件。"
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: turn, dir: below, threshold: 3}
- {op: close_pos_range, dir: above, threshold: 0.5}
rank: {op: turn_ma_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 10, dir: below, threshold: 1.0}
max_hold_days: 10
stop_loss: 8%
max_positions: 10
industry_cap: 0
