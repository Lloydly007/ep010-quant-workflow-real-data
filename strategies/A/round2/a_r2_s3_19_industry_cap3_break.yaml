name: a_r2_s3_19_industry_cap3_break
type: rule
desc: "现象：A股行业层面情绪同涨同跌，假突破在行业维度成簇——同行业多只票同一天假突破会让10个仓位一起爆，第1轮回撤中位-89.5%与持仓挤在同一风格直接相关，而第1轮完全没有组合层的行业暴露约束。为什么该有超额：单票假突破不可预测，但组合层面可以用行业上限把同时买在同一个行业情绪顶的暴露砍掉；个股侧用突破加换手<5%保证质量，组合侧用同行业最多3只保证分散，从而把回撤分布左尾压窄。怎么进出：20日新高、换手<5%、站在20日线上方才买；同行业最多3只、按20日涨幅降序；跌破20日线、持满20日、-8%止损。相对第1轮：把风控从个股止损上移到行业暴露上限，这是第1轮完全没有检验过的组合层假设。"
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: turn, dir: below, threshold: 5}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: ret_n, n: 20, order: desc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 3
