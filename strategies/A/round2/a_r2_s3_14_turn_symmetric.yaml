name: a_r2_s3_14_turn_symmetric
type: rule
desc: "现象：A股换手率对收益的预测是双向的——低换手入场有正超额，高换手是明确的卖出信号；而第1轮所有配置的卖出理由只有均线破位与固定持有。为什么该有超额：换手率高位对应情绪耗尽与筹码分散，突破之后的高换手往往就是派发日；用换手>10%主动离场，等于把情绪顶交给换手率判断，而不是等均线破位（那时已回撤10%以上）。怎么进出：20日新高、换手<5%、站在20日线上方才买；任一日换手>10%或跌破20日线即卖（卖出条件为或关系），持满20日、-8%止损；按20日均换手升序取最安静的10只。相对第1轮：买入与卖出用同一个变量做对称过滤，直接检验卖得太慢是不是第1轮回撤的主因。"
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: turn, dir: below, threshold: 5}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: turn_ma_n, n: 20, order: asc}
sell:
- {op: turn, dir: above, threshold: 10}
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
