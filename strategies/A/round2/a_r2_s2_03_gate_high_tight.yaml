name: a_r2_s2_03_gate_high_tight
type: rule
desc: 现象：第1轮的突破持仓多为10到20日，价格一旦回落到成本区就被均线卖点洗出，趋势利润被切碎。为何A股有超额：能长期停在250日高点5%以内且不需要放量的股票，说明没有获利盘急于兑现，这种“高位窄幅整理”是A股最接近机构锁仓的形态，指数上行期最容易再上一个台阶。进出：ETF120日线上方、距250日高点5%以内、20日量比低于1倍且站上20日线时买入，按距年线高点最近优先；距高点回落超15%才离场，最长40日、8%止损、同行业最多5只。相对第1轮改动：把“突破瞬间”换成“突破后不回落的持有期”，卖出用距高点距离而不是均线位置。
buy:
- {op: etf_above_ma_n, n: 120, dir: above, threshold: 0.5}
- {op: dist_high_n, n: 250, dir: above, threshold: -5}
- {op: vol_ratio_n, n: 20, dir: below, threshold: 1.0}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: dist_high_n, n: 250, order: desc}
sell:
- {op: dist_high_n, n: 250, dir: below, threshold: -15}
max_hold_days: 40
stop_loss: 8%
max_positions: 10
industry_cap: 5
