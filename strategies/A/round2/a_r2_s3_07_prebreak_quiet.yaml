name: a_r2_s3_07_prebreak_quiet
type: rule
desc: "现象：第1轮所有A路买点都要求已经突破或已创新高，等价于在突破当日买入，而A股突破日的次日往往就是短期高点。为什么该有超额：不买突破日本身、改买距60日高点5%以内且缩量横盘的票，把入场放在突破发生之前，吃的是突破前最后一段安静的筹码收集；换手<3%确保没有情绪资金提前涌入，避免买在脉冲顶部。怎么进出：距60日高点5%以内（dist_high_60>-5）、站上20日线、当日换手<3%、且不处于连跌中（连跌<3日）才买；从60日高点回落10%离场、持满20日、-8%止损；按20日均换手升序取最安静的10只。相对第1轮：这是本轮唯一不在突破日入场的配置，用来检验追突破日本身就是亏损来源这一判读。"
buy:
- {op: dist_high_n, n: 60, dir: above, threshold: -5}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
- {op: turn, dir: below, threshold: 3}
- {op: streak_down, dir: below, threshold: 3}
rank: {op: turn_ma_n, n: 20, order: asc}
sell:
- {op: dist_high_n, n: 60, dir: below, threshold: -10}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
