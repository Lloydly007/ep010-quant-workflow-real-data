name: a_r2_s2_06_gate_early_alignment
type: rule
desc: 现象：第1轮的均线条件多为单一20日或60日线，下降通道里的反弹也能满足，买进去就撞上中期下行。为何A股有超额：刚站上250日线且收盘价不到年线1.2倍的股票，是中期趋势由跌转涨的初期，上方没有长期套牢盘、后续空间最大；已远离年线的属于兑现区。进出：ETF120日线上方、站上250日线但不超过其1.2倍、同时站上20日线时买入，按120日涨幅由高到低优先；跌破120日线离场，最长60日、10%止损、同行业最多10只。相对第1轮改动：用“年线附近的多头初期”替代单均线条件，并用上界把已经涨透的股票排除在候选之外。
buy:
- {op: etf_above_ma_n, n: 120, dir: above, threshold: 0.5}
- {op: close_over_ma_n, n: 250, dir: above, threshold: 1.0}
- {op: close_over_ma_n, n: 250, dir: below, threshold: 1.2}
- {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
rank: {op: ret_n, n: 120, order: desc}
sell:
- {op: close_over_ma_n, n: 120, dir: below, threshold: 1.0}
max_hold_days: 60
stop_loss: 10%
max_positions: 10
industry_cap: 10
