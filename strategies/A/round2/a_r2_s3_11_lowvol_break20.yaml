name: a_r2_s3_11_lowvol_break20
type: rule
desc: "现象：高波动票的突破大多是噪声，且高波动票换手天然偏高，第1轮用动量或量比排序必然选中最吵的一组。为什么该有超额：低波异象在A股成立，低波状态下的突破信息含量高（一次有效突破就代表趋势切换），高波状态下的突破更可能只是一次噪声冲击；再叠加换手<5%的冷却要求，得到安静环境里的安静突破。怎么进出：20日新高、20日收益波动率<3%、换手<5%才买；跌破20日线离场、持满20日、-8%止损；按波动率升序在候选里挑最稳的10只。相对第1轮：第一次把波动率写进A路选股条件，用来剔除第1轮专挑高波高换手票造成的噪声型假突破。"
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: vol_n, n: 20, dir: below, threshold: 3}
- {op: turn, dir: below, threshold: 5}
rank: {op: vol_n, n: 20, order: asc}
sell:
- {op: close_over_ma_n, n: 20, dir: below, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
max_positions: 10
industry_cap: 0
