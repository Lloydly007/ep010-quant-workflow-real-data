name: a_r2_s1_19_ind_laggard
type: rule
desc: 现象：20日跌超8%、当日换手不足1%、贴250日低点15%以内，排序键用「行业内20日涨幅分位」由低到高——只买同一个行业里被单独抛弃的那一只。为什么A股该有超额：A股行业轮动极强，一个行业回暖时，行业内跌得最多、成交最冷的品种补涨弹性最大；用行业内分位排序可以剥离行业beta，避免买到整个行业都在崩塌的品种，而后者正是第1轮超跌组的主要亏损来源（全市场按跌幅排序时，往往是「整个行业一起跌」的样本排在最前面）。怎么进出：三条同时成立才买，rank用ind_rank(ret_n20)升序、行业上限5只，20日涨幅达到8%离场、20日上限、8%止损。行业口径为证监会门类单期快照，只能作近似排序键（池内覆盖约94%），这一点须在报告中如实标注。相对第1轮失败模式：第1轮行业零件的用法只有ind_rank desc追行业动量（a_r1_s1_11/a_r1_s3_19），本份把行业分位反过来用于超跌选股，并配合行业上限，让「行业中性」第一次进入A路的超跌假设。
buy:
  - {op: ret_n, n: 20, dir: below, threshold: -8.0}
  - {op: turn, dir: below, threshold: 1.0}
  - {op: dist_low_n, n: 250, dir: below, threshold: 15.0}
rank: {op: ind_rank, of: {op: ret_n, n: 20}, order: asc}
sell:
  - {op: ret_n, n: 20, dir: above, threshold: 8.0}
max_hold_days: 20
stop_loss: 8%
industry_cap: 5
