name: a_r2_s4_03_annual_clean_leader
type: rule
desc: 现象：过去250个交易日涨幅大于15%、现价仍在250日高点下方10%以内、且250日溃疡指数低于8%的股票，是"一年维度没被深跌打断的上涨"（日均约34只候选；因需250日历史，次新股天然被排除）。为什么A股该有超额：A股一年内常出现30%级别的急跌重置筹码结构，能把这类标的筛掉的组合避免了深回撤段的复利损耗；年度窗口能滤掉单次事件冲击（业绩爆雷、质押平仓）造成的伪低波动，长持有期又能摊薄A股偏高的双边交易成本与冲击成本。进出：三条准入同时满足后按250日溃疡指数升序取前10；持有60日、止损10%，只有跌离250日高点超过15%才卖出（不设均线卖点，避免震荡市里被均线来回甩）。相对第1轮失败模式的改动：第1轮最长只看120日且用20日突破入场、持有上限多为20到40日，反复交易付成本；本轮把检验窗口拉到年度级别、持有60日，用"整年最大回撤可控"替代"近期创新高"。
buy:
- {op: ret_n, n: 250, dir: above, threshold: 15}
- {op: dist_high_n, n: 250, dir: above, threshold: -10}
- {op: ulcer_n, n: 250, dir: below, threshold: 8}
rank: {op: ulcer_n, n: 250, order: asc}
sell:
- {op: dist_high_n, n: 250, dir: below, threshold: -15}
max_hold_days: 60
stop_loss: 10%
max_positions: 10
industry_cap: 10
