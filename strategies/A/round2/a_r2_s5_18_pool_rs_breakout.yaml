name: a_r2_s5_18_pool_rs_breakout
type: rule
desc: 现象：20 日新高突破每天有几十只股票同时出现，第 1 轮用突破事件本身当买入理由，等于在噪声里随机挑；突破只是入场事件，选谁应该由更长周期的相对强度决定。为什么在 A 股该有超额：突破的假突破率高，但“长期相对强度高加短期突破”的组合里，突破更可能是趋势延续而非诱多；用 250 日相对强度排名替代突破当日的量能排序，把选择权交给更慢的信号。怎么进出：创 20 日新高且站上 60 日线者，按 250 日涨幅的全池截面分位降序取前 10；跌破 60 日线离场，10 日上限、8% 止损、同行业最多 5 只。相对第 1 轮的改动：第 1 轮突破类配置用当日量比或短期涨幅排序，全是当日信息；本配置保留突破作为入场事件，把排序键换成长期相对强度。
buy:
- {op: break_high_n, n: 20, dir: above, threshold: 0.5}
- {op: close_over_ma_n, n: 60, dir: above, threshold: 1.0}
rank: {op: xsec_pct, of: {op: ret_n, n: 250}, order: desc}
sell:
- {op: close_over_ma_n, n: 60, dir: below, threshold: 1.0}
max_hold_days: 10
stop_loss: 8%
max_positions: 10
industry_cap: 5
