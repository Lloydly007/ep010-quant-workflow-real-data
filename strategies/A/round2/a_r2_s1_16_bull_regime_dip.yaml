name: a_r2_s1_16_bull_regime_dip
type: rule
desc: 现象：沪深300ETF在250日线上方（市场未破位），个股20日跌超8%、5日量比低于0.8、20日均换手低于2%——大盘没问题，个股缩量急跌。为什么A股该有超额：市场处于上行结构时，个股的缩量急跌是错杀而非系统性风险；A股资金轮动极快，「指数不跌个股跌」的品种在轮动回补时弹性最大，而此时的系统性风险已经被市场开关过滤掉——这直接针对第1轮A路回撤中位-89.5%的病根：无条件满仓买超跌，等于在指数熊市里放大beta。怎么进出：四条同时成立才买（含300ETF在250日线上方），rank按20日跌幅最深优先，收盘重回20日线上方离场、20日上限、8%止损。相对第1轮失败模式：第1轮也有ETF开关（a_r1_s2_11/a_r1_s3_14），但都是「开关打开后去买强势股」，等于用开关控制不了真正的风险来源；本份把开关用在超跌股上，让下行保护与均值回归同时生效，是A路第一次把beta控制写进入场条件而不是卖出条件。
buy:
  - {op: etf_above_ma_n, n: 250, dir: above, threshold: 0.5}
  - {op: ret_n, n: 20, dir: below, threshold: -8.0}
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 0.8}
  - {op: turn_ma_n, n: 20, dir: below, threshold: 2.0}
rank: {op: ret_n, n: 20, order: asc}
sell:
  - {op: close_over_ma_n, n: 20, dir: above, threshold: 1.0}
max_hold_days: 20
stop_loss: 8%
industry_cap: 5
