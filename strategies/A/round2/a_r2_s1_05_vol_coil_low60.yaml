name: a_r2_s1_05_vol_coil_low60
type: rule
desc: 现象：20日ATR/收盘已压到3%以下（波动压缩），同时收盘贴60日低点5%以内、5日量比低于0.8——振幅、位置、成交量三条同时收缩。为什么A股该有超额：波动压缩代表多空都不愿出价，筹码在低位被反复换手而价格不再下移，这是「贴底横盘」的核心特征；A股此类形态一旦被资金选中，量能放大带来的是连续快速拉升式的修复，赔率极高，且因为波动已经压平，止损被打掉的概率反而低。怎么进出：三条同时成立才买，rank按20日ATR由低到高（最压缩者先买），回到60日高点2%以内视为修复完成、40日上限、不设止损（压缩末端的插针最容易打掉止损单）。相对第1轮失败模式：第1轮的低位组（a_r1_s5_06/a_r1_s1_06）只看「跌得深／贴近低点」，不看波动与成交量是否已经收缩，结果买在仍在放量下跌的半山腰；本份用「波动＋量能双收缩」确认抛压真的枯竭，并把持有期给到40日，让压缩释放有时间发生。
buy:
  - {op: atr_close_n, n: 20, dir: below, threshold: 3.0}
  - {op: dist_low_n, n: 60, dir: below, threshold: 5.0}
  - {op: vol_ratio_n, n: 5, dir: below, threshold: 0.8}
rank: {op: atr_close_n, n: 60, order: asc}
sell:
  - {op: dist_high_n, n: 60, dir: above, threshold: -2.0}
max_hold_days: 40
stop_loss: 无
industry_cap: 10
