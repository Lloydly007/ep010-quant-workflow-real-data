desc: 三尺度级联（20 日 -0.25 / 120 日 -0.40 / 250 日 -0.55，权重按月→季→年递增）：一次把「多尺度平滑」推到本零件集的上限，检验两窗已经够用还是仍有第三尺度的增益。递增票数的含义是可信度随窗口长度上升（长窗更少受单次事件污染），短窗只做调整。若本份不劣于
