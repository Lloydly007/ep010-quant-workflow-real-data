desc: 双窗换手腿整体放轻（各 -0.30，两腿合计不到三成票数），规模与估值加重到 -1.10 / -0.55。这是本组的「换手暴露剥离」对照：若双窗平滑的价值只是换手因子本身的暴露，把双窗票数砍到
