  12 对的温和档：size_ln −0.80、turn_ma_n(120) −0.30。按 |w| 归一：size_ln 38.1% / turn_ma_n(120)
  14.3% / ps_ttm 23.8% / pb 23.8%。同对的另一份只改规模与换手两个档位，其余腿与窗口完全一致，因此两份之差就是「风格暴露强度」的边际贡献。持仓
  30、每周首个交易日调仓、按行业内秩中性化。
