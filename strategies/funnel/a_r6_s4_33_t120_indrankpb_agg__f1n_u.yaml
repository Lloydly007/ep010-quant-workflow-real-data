desc: 估值腿改为行业内排名（ind_rank of pb）：在 neut_industry 已把打分按行业内秩中性化的前提下，再叠一条「行业内最便宜」的腿，等于把估值也放到行业内部比较，避免整组落进天然低
  pb 的行业。激进档里行业相对便宜只占 12.5%、规模仍主导；温和档它升到 31%，检验行业相对估值能否单独撑起名单，还是必须靠极端小市值带路。本份为第 17
  对的激进档：size_ln −2.50、turn_ma_n(120) −1.00。按 |w| 归一：size_ln 62.5% / turn_ma_n(120)
  25.0% / ind_rank(pb) 12.5%。同对的另一份只改规模与换手两个档位，其余腿与窗口完全一致，因此两份之差就是「风格暴露强度」的边际贡献。持仓
  30、每周首个交易日调仓、按行业内秩中性化。
